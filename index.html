      var when  = r.updated_at ? " <span class='rt'>· " + new Date(r.updated_at).toLocaleString() + "</span>" : "";
      return '<button data-code="' + r.code + '"><span class="rc">' + r.code + '</span>' + title + when + '</button>';
    }).join("") + '</div></div>';
    host.querySelectorAll("button[data-code]").forEach(function(b){
      b.addEventListener("click", function(){
        var code = this.dataset.code;
        if (!Me){ toast("먼저 로그인이 필요합니다"); openAuthModal(); return; }
        joinRoom(code).then(function(){ toast("코트 " + code + " 접속"); refreshAuthUI(); })
          ["catch"](function(e){ toast(e.message || e); });
      });
    });
  })["catch"](function(){
    host.innerHTML = '<div class="card"><p class="empty">코트 목록을 불러올 수 없습니다</p></div>';
  });
}

function finishIntro(){
  introStep = 0;
  courtTouched = false;
  S.schedule = null; S.sessionId = null; DB.current = null; S.savedAt = null; dirty = false;
  var mn = minPlayers(S.mode);
  if (S.count < mn) S.count = mn === 2 ? 4 : 8;
  if (S.mode === "single" || S.pair !== "mixed") S.genders = [];
  else ensureGenders();
  S.tab = "sched";
  render();
  window.scrollTo({top:0});
}

// 실력 등급 표기 (내부값 3·2·1 → A·B·C)
var LVL = { 3:"A", 2:"B", 1:"C" };
function ensureLevels(){
  for (var i=0;i<S.count;i++){
    if (S.levels[i] !== 1 && S.levels[i] !== 2 && S.levels[i] !== 3) S.levels[i] = 2;
  }
  S.levels.length = S.count;
}

// 혼복 기본 성별: 남·여 번갈아 (1·2번, 3·4번이 각각 남녀 한 쌍이 되도록)
function ensureGenders(){
  for (var i=0;i<S.count;i++){
    if (S.genders[i] !== "M" && S.genders[i] !== "F") S.genders[i] = (i % 2 === 0) ? "M" : "F";
  }
  S.genders.length = S.count;
}

/* ---------------- 설정 카드 접기 ----------------
   카드는 언제나 접거나 펼칠 수 있다. 이미 정해진 값(종목·일자·파트너·등급)은 처음부터 접혀 있고,
   참가자 이름을 전원 입력하면 나머지도 한 번 자동으로 접힌다. */
var FOLD_KEYS = ["mode","date","count","courts","games","partner","level","names"];
// 첫 화면에서 접어 둘 카드 — 값이 이미 정해져 있어 확인만 필요한 것들
var foldClosed = { mode:true, date:true, partner:true, level:true };
var foldAuto   = false;  // 전원 입력에 따른 자동 접기를 이미 했는지
var foldBound  = false;

function allNamesFilled(){
  for (var i=0;i<S.count;i++){ if (!String(S.names[i]||"").trim()) return false; }
  return true;
}

function foldSummary(key){
  switch (key){
    case "mode":   return modeLabel(S);
    case "date":   return fmtDate(S.date);
    case "count":  return S.count + "명";
    case "courts":
      var rst = S.count - S.courts*perCourt(S.mode);
      return "코트 " + S.courts + "면 · " + (rst ? rst + "명 휴식" : "전원 출전");
    case "games":  return "1인당 " + S.games + "경기 · 총 " + roundsFor(cfgNow()) + "라운드";
    case "partner":
      var isMx = S.mode === "double" && S.pair === "mixed";
      var pv = isMx ? S.mixPartner : S.samePartner;
      return pv === "fixed" ? (isMx ? "고정 조" : "2인 고정페어") : "랜덤";
    case "level":
      if (!S.useLevel) return "사용 안 함";
      var c = { A:0, B:0, C:0 };
      for (var j=0;j<S.count;j++) c[LVL[lvIn(S,j)]]++;
      return "A " + c.A + " · B " + c.B + " · C " + c.C;
    case "names":
      var ns = [];
      for (var i=0;i<S.count;i++) ns.push(String(S.names[i]||"").trim() || ("참가자 " + (i+1)));
      return ns.join(", ");
  }
  return "";
}

function bindFold(){
  if (foldBound) return;
  foldBound = true;
  Array.prototype.forEach.call(document.querySelectorAll("#setup .fold"), function(card){
    var key = card.dataset.fold;
    var head = card.querySelector(".foldhead");
    function toggle(){
      foldClosed[key] = !foldClosed[key];
      paintFold();
    }
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
    });
  });
  $("#fold-all").addEventListener("click", function(){
    var anyOpen = FOLD_KEYS.some(function(k){ return !foldClosed[k]; });
    FOLD_KEYS.forEach(function(k){ foldClosed[k] = anyOpen; });
    paintFold();
  });
}

function paintFold(){
  Array.prototype.forEach.call(document.querySelectorAll("#setup .fold"), function(card){
    var key = card.dataset.fold;
    card.classList.toggle("closed", !!foldClosed[key]);
    card.querySelector(".foldsum").textContent = foldClosed[key] ? foldSummary(key) : "";
    var head = card.querySelector(".foldhead");
    head.setAttribute("role","button");
    head.setAttribute("tabindex","0");
    head.setAttribute("aria-expanded", foldClosed[key] ? "false" : "true");
  });
  var fa = $("#fold-all");
  fa.hidden = false;
  fa.textContent = FOLD_KEYS.some(function(k){ return !foldClosed[k]; }) ? "설정 모두 접기" : "설정 모두 펼치기";
}

// autoClose=true 인 시점(이름 전원 입력 후 칸을 벗어남)에 최초 1회 자동으로 접는다
function refreshFold(autoClose){
  bindFold();
  if (autoClose && !foldAuto && allNamesFilled()){
    // 붕괴가 진행 중인 좌표에서 탭이 빗나가지 않도록 다음 틱으로 미루고,
    // 포커스가 설정 화면 밖으로 나갔을 때만 접는다 (이름 칸 사이 이동에는 반응하지 않음)
    setTimeout(function(){
      var ae = d.activeElement;
      if (ae && ae.closest && ae.closest("#setup")) return;
      if (foldAuto || !allNamesFilled()) return;
      foldAuto = true;
      FOLD_KEYS.forEach(function(k){ foldClosed[k] = true; });
      paintFold();
    }, 0);
  }
  paintFold();
}

/* ---------------- setup rendering ---------------- */
function renderSetup(){
  $("#date").value = S.date;
  $("#mode-label").textContent = modeLabel(S);
  var mixed = (S.mode === "double" && S.pair === "mixed");
  if (mixed) ensureGenders();

  var mn = minPlayers(S.mode);
  $("#p-val").textContent = S.count;
  $("#p-minus").disabled = S.count <= mn;
  $("#p-plus").disabled  = S.count >= CONST.MAX_COUNT;
  $("#p-range").textContent = mn + " – 16";

  ensureLevels();
  var fx = fixedMode(S), fxBad = fx ? fixedProblem(S) : null;
  var maxC = maxCourts(S.count, S.mode, mixed ? S.genders : null, fx && !fxBad);
  if (!courtTouched) S.courts = maxC;
  if (S.courts > maxC) S.courts = maxC;
  var pc = perCourt(S.mode);
  $("#court-hint").textContent = "코트 1면에 " + pc + "명" + (mixed ? " (남 2 · 여 2)" : "")
    + " · 이 인원이면 최대 " + maxC + "코트까지 쓸 수 있습니다.";

  var cc = $("#c-chips");
  if (!cc.children.length){
    for (var j=1;j<=4;j++){
      var cb = document.createElement("button");
      cb.className = "chip"; cb.textContent = j; cb.dataset.c = j;
      cb.addEventListener("click", function(){ courtTouched = true; S.courts = +this.dataset.c; renderSetup(); save(); });
      cc.appendChild(cb);
    }
  }
  Array.prototype.forEach.call(cc.children, function(b){
    var v = +b.dataset.c;
    b.disabled = v > maxC;
    b.setAttribute("aria-pressed", v === S.courts ? "true" : "false");
  });
  var rest = S.count - S.courts*pc;
  $("#court-detail").textContent = (courtTouched ? "" : "자동 선택(최대 " + maxC + "코트) · ")
    + "코트 " + S.courts + "면 동시 진행 · "
    + (rest ? "매 라운드 " + rest + "명 휴식" : "전원 매 라운드 출전")
    + (fx && !fxBad ? " (고정 조 " + pairsOf(S).length + "조 중 " + (S.courts*2) + "조 출전)" : "");

  // 코트 이름 입력 UI
  var cnBox = $("#court-names");
  if (cnBox){
    cnBox.style.display = S.courts > 1 ? "" : "none";
    if (S.courts > 1){
      var list = $("#court-name-list");
      var html = "";
      for (var ci=0; ci<S.courts; ci++){
        var v = (S.courtNames || [])[ci] || "";
        html += '<div class="cn-row"><span class="cn-idx">코트 ' + (ci+1) + '</span>' +
                '<input data-cn-idx="' + ci + '" maxlength="16" value="' + esc(v) + '" placeholder="예: 인도어 A"></div>';
      }
      list.innerHTML = html;
      list.querySelectorAll("input[data-cn-idx]").forEach(function(inp){
        inp.addEventListener("input", function(){
          var i = +this.dataset.cnIdx;
          if (!S.courtNames) S.courtNames = [];
          S.courtNames[i] = this.value;
          save();
        });
      });
    }
  }

  // 파트너 카드 — 혼복 OR 6인 동성복식
  var sameFixOK = sameFixedEligible(S);
  var pcard = $("#card-partner");
  pcard.hidden = !mixed && !sameFixOK;
  if (mixed || sameFixOK){
    if (!$("#pt-seg").dataset.bound){
      $("#pt-seg").dataset.bound = "1";
      Array.prototype.forEach.call($("#pt-seg").children, function(b){
        b.addEventListener("click", function(){
          // 혼복이면 mixPartner, 동성복식이면 samePartner
          if ((S.mode === "double" && S.pair === "mixed")) S.mixPartner = this.dataset.p;
          else S.samePartner = this.dataset.p;
          courtTouched = false;   // 고정/랜덤에 따라 코트 상한이 달라진다
          renderSetup(); save();
        });
      });
    }
    var curPartner = mixed ? S.mixPartner : S.samePartner;
    Array.prototype.forEach.call($("#pt-seg").children, function(b){
      b.setAttribute("aria-pressed", b.dataset.p === curPartner ? "true" : "false");
      // 라벨을 동성복식에서는 "2인 고정페어"로
      if (b.dataset.p === "fixed") b.textContent = mixed ? "고정 조" : "2인 고정페어";
    });
    var ph = $("#pt-hint");
    if (curPartner !== "fixed"){
      ph.innerHTML = "매 경기 <b>새로운 파트너</b>와 팀이 됩니다. 같은 사람과 두 번 짝이 되지 않도록 배분합니다.";
    } else if (fxBad){
      ph.innerHTML = '<span style="color:#b03b3b;font-weight:700">' + esc(fxBad) + "</span>";
    } else {
      var lead = mixed
        ? "이름 순서대로 <b>2명씩 한 조</b>가 되어 대회 끝까지 같은 파트너로 뜁니다. "
        : "이름 순서대로 <b>2명씩 한 페어</b> (총 3페어)가 되어 끝까지 같은 파트너로 뜁니다. 매 라운드 3페어 중 2페어가 뛰고 1페어는 쉽니다. ";
      ph.innerHTML = lead + "조 편성을 바꾸려면 이름 순서를 바꾸세요."
        + '<span class="pairline">' + pairsOf(S).map(function(p, i){
            return '<span class="pairchip">' + (i+1) + "페어 · " + esc(nameOf(p[0])) + " · " + esc(nameOf(p[1])) + "</span>";
          }).join("") + "</span>";
    }
  }

  // 실력 등급
  if (!$("#lv-seg").dataset.bound){
    $("#lv-seg").dataset.bound = "1";
    Array.prototype.forEach.call($("#lv-seg").children, function(b){
      b.addEventListener("click", function(){
        S.useLevel = this.dataset.l === "on";
        if (S.useLevel) foldClosed["names"] = false;   // 등급 버튼이 접힘 뒤에 숨지 않게
        renderSetup(); save();
      });
    });
  }
  Array.prototype.forEach.call($("#lv-seg").children, function(b){
    b.setAttribute("aria-pressed", (b.dataset.l === "on") === !!S.useLevel ? "true" : "false");
  });
  if (!S.useLevel){
    $("#lv-hint").innerHTML = "등급을 쓰지 않으면 실력과 무관하게 중복 회피만 고려합니다.";
  } else if (!levelSet(S)){
    $("#lv-hint").innerHTML = '<span style="color:#8f2f2f;font-weight:700">아직 전원 B라 전력 맞추기가 적용되지 않습니다.</span>'
      + " 아래 이름 칸의 <b>A · B · C</b> 버튼을 눌러 등급을 지정하세요. (A 상 · B 중 · C 하)";
  } else {
    $("#lv-hint").innerHTML = "양 팀 전력 합이 비슷해지도록 팀을 짭니다. "
      + "페어·상대 중복 회피가 우선이고 그다음 전력 균형입니다.";
  }

  var chips = $("#r-chips");
  if (!chips.children.length){
    CONST.GAMES.forEach(function(gi){
      var b2 = document.createElement("button");
      b2.className = "chip"; b2.textContent = gi; b2.dataset.r = gi;
      b2.addEventListener("click", function(){ S.games = +this.dataset.r; renderSetup(); save(); });
      chips.appendChild(b2);
    });
  }
  Array.prototype.forEach.call(chips.children, function(b){
    b.setAttribute("aria-pressed", +b.dataset.r === S.games ? "true" : "false");
  });

  // 혼복 성별 구성 검증
  var bad = null;
  if (mixed){
    var g = genderSplit({ n:S.count, genders:S.genders });
    if (g.M < 2 || g.F < 2) bad = "혼성 복식은 남녀 각각 2명 이상이 필요합니다. (현재 남 " + g.M + " · 여 " + g.F + ")";
    else if (g.M < S.courts*2 || g.F < S.courts*2)
      bad = "코트 " + S.courts + "면을 채우려면 남녀 각각 " + (S.courts*2) + "명 이상이 필요합니다. (현재 남 " + g.M + " · 여 " + g.F + ")";
    else if (fxBad) bad = "파트너 고정: " + fxBad;
  }
  $("#mixed-warn").hidden = !bad;
  if (bad) $("#mixed-warn-msg").textContent = bad;
  $("#make").disabled = !!bad;

  var cfg = cfgNow();
  if (!bad){
    var L = loadFor(cfg);
    var msg = "총 " + L.rounds + "라운드 진행 · 전원 " + L.min + "경기"
      + (L.extra ? " (" + L.extra + "명은 " + L.max + "경기)" : " 균등");
    if (S.count >= 6 && S.games >= 4){
      msg += streakFeasible(cfg) ? " · 4연속 출전 없음" : " · 4연속 출전 최소화 (완전 회피 불가)";
    }
    $("#round-hint").textContent = msg;
  } else {
    $("#round-hint").textContent = "";
  }

  var box = $("#names");
  if (box.children.length !== S.count || box.dataset.mixed !== String(mixed)
      || box.dataset.lv !== String(!!S.useLevel)){
    box.innerHTML = "";
    box.dataset.mixed = String(mixed);
    box.dataset.lv = String(!!S.useLevel);
    for (var k=0;k<S.count;k++){
      var f = document.createElement("label");
      f.className = "name-field";
      f.innerHTML = '<span class="name-no">'+(k+1)+'</span><input type="text" maxlength="10" placeholder="이름 입력">';
      var inp = f.querySelector("input");
      inp.value = S.names[k] || "";
      inp.dataset.k = k;
      inp.setAttribute("enterkeyhint", k === S.count-1 ? "done" : "next");
      inp.setAttribute("autocomplete", "off");
      inp.spellcheck = false;
      inp.addEventListener("input", function(){ S.names[+this.dataset.k] = this.value; save(); refreshFold(false); });
      // Enter로 다음 이름 칸으로 (16명 입력의 왕복을 줄인다)
      inp.addEventListener("keydown", function(e){
        if (e.key !== "Enter") return;
        e.preventDefault();
        var nx = $("#names").querySelectorAll("input")[+this.dataset.k + 1];
        if (nx) nx.focus(); else this.blur();
      });
      // 입력을 마치고 칸을 벗어났을 때(전원 입력 완료 시점) 한 번 자동으로 접는다
      inp.addEventListener("change", function(){ refreshFold(true); });
      inp.addEventListener("blur",   function(){ refreshFold(true); });
      if (mixed){
        var gb = document.createElement("button");
        gb.type = "button"; gb.className = "gbtn"; gb.dataset.k = k;
        gb.addEventListener("click", function(e){
          e.preventDefault();
          var i2 = +this.dataset.k;
          S.genders[i2] = S.genders[i2] === "F" ? "M" : "F";
          renderSetup(); save();
        });
        f.appendChild(gb);
      }
      if (S.useLevel){
        var lb = document.createElement("button");
        lb.type = "button"; lb.className = "lvbtn"; lb.dataset.k = k;
        lb.addEventListener("click", function(e){
          e.preventDefault();
          var i4 = +this.dataset.k;
          S.levels[i4] = lvIn(S, i4) === 3 ? 2 : (lvIn(S, i4) === 2 ? 1 : 3);   // A→B→C→A
          renderSetup(); save();
        });
        f.appendChild(lb);
      }
      box.appendChild(f);
    }
  }
  // 상태가 화면 밖에서 바뀐 경우(명단 불러오기 등) 입력 칸을 맞춘다. 입력 중인 칸은 건드리지 않는다
  Array.prototype.forEach.call(box.querySelectorAll("input"), function(inp){
    var kk = +inp.dataset.k, v = S.names[kk] || "";
    if (inp !== d.activeElement && inp.value !== v) inp.value = v;
  });

  var rule;
  if (S.mode === "single"){
    rule = "1라운드 코트 1은 <b>1번 vs 2번</b>으로 고정되고, 나머지는 같은 상대를 두 번 만나지 않도록 배분합니다.";
  } else if (mixed){
    var gg = genderSplit({ n:S.count, genders:S.genders });
    var pinOff = (S.genders[0] === S.genders[1] || S.genders[2] === S.genders[3]);
    rule = "모든 팀은 <b>남 1명 · 여 1명</b>으로 구성됩니다. ";
    rule += pinOff
      ? "1~4번이 남녀 한 쌍씩이 아니어서 <b>1라운드 고정은 적용되지 않습니다.</b> 순서를 남·여·남·여로 맞추면 적용됩니다."
      : "1라운드 코트 1은 <b>1·2번 vs 3·4번</b>으로 고정됩니다.";
    if (gg.M !== gg.F) rule += " 남녀 인원이 달라(남 " + gg.M + " · 여 " + gg.F + ") 인원이 적은 쪽이 더 많이 뜁니다.";
  } else {
    rule = "1라운드 코트 1은 <b>1·2번 vs 3·4번</b>으로 고정되고, 나머지는 같은 사람과 두 번 짝이 되지 않도록 짠 뒤 상대가 겹치지 않게 배분합니다.";
  }
  $("#rule-hint").innerHTML = rule;

  // 저장이 불가능한 환경이면 미리 알린다 (시크릿 모드 등)
  var sw = $("#store-warn");
  if (Store.kind() === "memory"){
    sw.hidden = false;
    sw.textContent = "이 브라우저에서는 결과를 저장할 수 없습니다. 새로고침하면 사라지니 경기 후 '결과 복사'로 남겨두세요. (시크릿 모드라면 일반 모드로 열어보세요)";
  } else sw.hidden = true;

  if (mixed){
    Array.prototype.forEach.call(box.querySelectorAll(".gbtn"), function(b){
      var i3 = +b.dataset.k, isF = S.genders[i3] === "F";
      b.textContent = isF ? "여" : "남";
      b.className = "gbtn " + (isF ? "f" : "m");
      b.setAttribute("aria-label", (i3+1) + "번 성별 전환");
    });
  }
  if (S.useLevel){
    Array.prototype.forEach.call(box.querySelectorAll(".lvbtn"), function(b){
      var i5 = +b.dataset.k, v = lvIn(S, i5);
      b.textContent = LVL[v];
      b.className = "lvbtn " + LVL[v].toLowerCase();
      var nx = v === 3 ? 2 : (v === 2 ? 1 : 3);
      b.setAttribute("aria-label", (i5+1) + "번 실력 등급 " + LVL[v] + ", 누르면 " + LVL[nx]);
    });
  }

  // 지난 경기 명단 불러오기 — 매 회차 이름 16개를 다시 타이핑하지 않도록
  var lastKey = null, keys = dateKeys();
  // 현재 세션과 다른 가장 최근 세션을 찾는다 (같은 날 다른 시간대도 포함)
  var curKey = S.sessionId || S.date;
  for (var q=0;q<keys.length;q++){ if (keys[q] !== curKey){ lastKey = keys[q]; break; } }
  var lr = $("#load-roster");
  lr.hidden = !lastKey;
  if (lastKey){
    lr.textContent = fmtSessionKey(lastKey) + " 명단 불러오기 (" + DB.sessions[lastKey].count + "명)";
    lr.dataset.d = lastKey;
  }

  // 설정 화면 하단 고정 CTA — 카드 8장 아래까지 스크롤하지 않아도 만들 수 있게
  var sb = $("#setupmsg"), mk2 = $("#make2");
  sb.innerHTML = bad
    ? '<b style="color:#8f2f2f">설정을 확인해 주세요</b>'
    : "<b>" + S.count + "명</b> · 코트 " + S.courts + "면 · " + loadFor(cfg).rounds + "라운드 · 1인당 " + S.games + "경기";
  mk2.disabled = !!bad;

  refreshFold(false);
}

/* ---------------- schedule rendering ---------------- */
function renderSchedule(){
  var host = $("#sched");
  host.innerHTML = "";
  var dup = dupPairs(S.schedule);
  var head = document.createElement("p");
  head.className = "hint";
  head.style.margin = "16px 0 0";
  var cfg = cfgNow();
  var L = loadFor(cfg);
  var mxs = streaksOf(S.schedule, S.count);
  var worst = Math.max.apply(null, mxs);
  var dupWord = S.mode === "single" ? "중복 대진" : "중복 페어";
  head.textContent = modeLabel(S) + " · " + S.count + "명 · 1인당 " + L.min + "경기" + (L.extra ? "+" : "")
    + " · " + S.schedule.length + "라운드 · 코트 " + S.courts + "면"
    + (cfg.fixed ? " · 파트너 고정" : "")
    + (cfg.fixed ? "" : (dup ? " · " + dupWord + " " + dup + "회" : " · " + dupWord + " 없음"))
    + " · 최장 연속 " + worst + "경기"
    + (S.useLevel && levelSet(S) ? " · 팀 전력 편차 평균 " + balOf(S).toFixed(1) : "");
  host.appendChild(head);

  if (viewOnly){
    var vo = document.createElement("div");
    vo.className = "warnbox";
    vo.style.margin = "10px 0 0";
    vo.innerHTML = "<b>공유받은 결과를 보고 있습니다.</b> 점수는 수정할 수 없고 이 기기에 저장되지 않습니다. "
      + "이 화면은 링크를 다시 열면 언제든 복원됩니다.";
    var ib = document.createElement("button");
    ib.className = "btn";
    ib.style.cssText = "width:100%;margin-top:10px";
    ib.textContent = "내 기록에 저장하고 점수 수정하기";
    ib.addEventListener("click", doImport);   // 카드는 매 렌더마다 새로 만들어 중복 바인딩이 없다
    vo.appendChild(ib);
    host.appendChild(vo);
  }

  if (S.count >= 6 && S.games >= 4 && worst >= 4 && !streakFeasible(cfg)){
    var warn = document.createElement("p");
    warn.className = "hint";
    warn.style.margin = "6px 0 0";
    var b = S.count - S.courts*perCourt(S.mode);
    if (b > 0) warn.style.color = "#8f2f2f";   // 휴식이 있는데도 4연속이 나오면 진짜 경고
    var less = { n:S.count, courts:Math.max(1,S.courts-1), games:S.games, type:typeOf(S),
                 genders:S.genders, fixed:cfg.fixed, pairs:cfg.pairs };
    warn.textContent = (b === 0
      ? "코트 " + S.courts + "면이면 전원이 매 라운드 출전합니다(정상). 휴식을 넣으려면"
      : "라운드당 휴식이 " + b + "명뿐입니다. 4연속을 없애려면")
      + " 코트를 " + Math.max(1,S.courts-1) + "면으로 줄이세요 — 라운드가 "
      + S.schedule.length + "→" + roundsFor(less) + "로 늘어납니다.";
    host.appendChild(warn);
  }

  S.schedule.forEach(function(rd, ri){
    var sec = document.createElement("div");
    sec.className = "round";
    var h = document.createElement("div");
    h.className = "round-head";
    var dn = 0;
    rd.matches.forEach(function(m){ if (filled(m)) dn++; });
    h.innerHTML = '<span class="round-no">'+(ri+1)+'라운드</span>'
      + '<span class="round-tag' + (dn === rd.matches.length ? " full" : "") + '">'
      + dn + ' / ' + rd.matches.length + '</span>';
    sec.appendChild(h);

    rd.matches.forEach(function(m, mi){
      var el = document.createElement("div");
      el.className = "court" + (filled(m) ? " done" : "");
      el.innerHTML =
        '<span class="court-label">' + esc(courtLabel(mi).toUpperCase()) + '</span>' +
        side(m, "a", ri, mi) +
        '<div class="net"></div>' +
        side(m, "b", ri, mi);
      sec.appendChild(el);
    });

    if (rd.byes.length){
      var rest = document.createElement("p");
      rest.className = "rest";
      rest.innerHTML = "휴식 &nbsp;<b>" + rd.byes.map(nameOf).join(", ") + "</b>";
      sec.appendChild(rest);
    }
    host.appendChild(sec);
  });
}

function side(m, key, ri, mi){
  var team = key === "a" ? m.a : m.b;
  var sc   = key === "a" ? m.sa : m.sb;
  var other= key === "a" ? m.sb : m.sa;
  var win  = filled(m) && (+sc) > (+other);
  return '<div class="side">' +
    '<div class="players">' +
      '<div class="nm">' + team.map(function(t){
        return esc(nameOf(t)) + (S.useLevel ? '<span class="lv">' + LVL[lvIn(S,t)] + '</span>' : "");
      }).join(" · ") + '</div>' +
      '<div class="sub">' + (key === "a" ? "A" : "B") + (team.length > 1 ? "팀" : "") + '</div>' +
    '</div>' +
    '<input class="score' + (win ? " win" : "") + '" type="number" inputmode="numeric" min="0" max="99" ' +
      (viewOnly ? "readonly " : "") +
      'placeholder="–" value="' + (sc === null || sc === "" ? "" : sc) + '" ' +
      'data-r="' + ri + '" data-m="' + mi + '" data-k="' + key + '" ' +
      'aria-label="' + team.map(function(t){ return esc(nameOf(t)); }).join(" ") + ' 점수">' +
  '</div>';
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* live score entry — updates without rebuilding the whole list (keeps focus) */
$("#sched").addEventListener("input", function(e){
  var el = e.target;
  if (viewOnly || !el.classList.contains("score")) return;
  var v = el.value.replace(/[^0-9]/g,"").slice(0,2);
  if (v !== el.value) el.value = v;
  var m = S.schedule[+el.dataset.r].matches[+el.dataset.m];
  m[el.dataset.k === "a" ? "sa" : "sb"] = v === "" ? null : +v;

  var court = el.closest(".court");
  court.classList.toggle("done", filled(m));
  var inputs = court.querySelectorAll(".score");
  inputs[0].classList.toggle("win", filled(m) && +m.sa > +m.sb);
  inputs[1].classList.toggle("win", filled(m) && +m.sb > +m.sa);

  // 그 라운드가 다 찼는지 배지를 즉시 갱신 (전체 재렌더 없이)
  var rd = S.schedule[+el.dataset.r], dn = 0;
  rd.matches.forEach(function(x){ if (filled(x)) dn++; });
  var rt = el.closest(".round").querySelector(".round-tag");
  if (rt){
    rt.textContent = dn + " / " + rd.matches.length;
    rt.classList.toggle("full", dn === rd.matches.length);
  }

  dirty = true;
  renderProgress(); renderRank(); renderSaveBar();
  autosave();
});

/* 코트 카드 어디를 눌러도 그 팀 점수 칸으로 들어간다 (행의 4/5가 죽은 영역이었다) */
$("#sched").addEventListener("click", function(e){
  var t = e.target;
  if (!t.closest) return;
  if (t.classList && t.classList.contains("score")){
    if (viewOnly) toast("공유받은 결과입니다. 점수는 수정할 수 없습니다");
    return;
  }
  if (viewOnly) return;
  var side = t.closest(".side"); if (!side) return;
  var inp = side.querySelector(".score"); if (!inp) return;
  inp.focus();
  try { inp.select(); } catch(_){}
});

/* 이미 값이 있는 칸은 전체 선택 — 백스페이스 없이 덮어쓰게 (6에 7을 치면 67이 되던 문제) */
$("#sched").addEventListener("focusin", function(e){
  var el = e.target;
  if (!el.classList || !el.classList.contains("score")) return;
  try { el.select(); } catch(_){}
});

/* ---------------- summary rendering (read-only overview) ---------------- */
function renderSummary(){
  var host = $("#summary");
  var vo = viewOnly ? '<div class="warnbox" style="margin-top:16px">공유받은 결과를 보고 있습니다. 점수는 수정할 수 없습니다.</div>' : "";
  var courts = S.courts;
  var head = "";
  for (var c=0;c<courts;c++) head += "<th>" + esc(courtLabel(c)) + "</th>";
  var anyBye = S.schedule.some(function(r){ return r.byes.length; });
  if (anyBye) head += "<th style='text-align:left;padding-left:20px'>휴식</th>";

  var body = S.schedule.map(function(rd, ri){
    var tds = rd.matches.map(function(m){
      var done = filled(m);
      var aw = done && +m.sa > +m.sb, bw = done && +m.sb > +m.sa;
      return '<td class="vscol"><span class="vs">' +
        '<span class="t' + (aw?" w":"") + '">' + m.a.map(function(t){ return esc(nameOf(t)); }).join("·") + '</span>' +
        '<span class="sc' + (done?"":" pending") + '">' + (done ? m.sa + ":" + m.sb : "–") + '</span>' +
        '<span class="t' + (bw?" w":"") + '">' + m.b.map(function(t){ return esc(nameOf(t)); }).join("·") + '</span>' +
      '</span></td>';
    }).join("");
    if (anyBye) tds += '<td class="byecol">' + (rd.byes.length ? rd.byes.map(nameOf).map(esc).join(", ") : "–") + '</td>';
    return "<tr><td>" + (ri+1) + "</td>" + tds + "</tr>";
  }).join("");

  // 개인별 라운드 매트릭스 - 컬럼 폭을 첫 행 th에 인라인으로 명시 (table-layout:fixed와 조합)
  var nR = S.schedule.length;
  var firstPct = 14, lastPct = 8;
  var rndPct = (100 - firstPct - lastPct*2) / nR;
  var mxHead = '<th style="width:' + firstPct + '%">참가자</th>';
  S.schedule.forEach(function(_, ri){ mxHead += '<th style="width:' + rndPct + '%">' + (ri+1) + '</th>'; });
  mxHead += '<th style="width:' + lastPct + '%">경기</th><th style="width:' + lastPct + '%">연속</th>';

  var streaks = streaksOf(S.schedule, S.count);
  var mxBody = "";
  for (var p=0;p<S.count;p++){
    var cells = "", total = 0;
    S.schedule.forEach(function(rd){
      var hit = null;
      rd.matches.forEach(function(m, mi){
        if (m.a.indexOf(p) >= 0) hit = { c:mi, t:"A" };
        else if (m.b.indexOf(p) >= 0) hit = { c:mi, t:"B" };
      });
      if (hit){ total++; cells += '<td><span class="cell c' + (hit.c % 4) + '">' + (hit.c+1) + hit.t + '</span></td>'; }
      else cells += '<td><span class="cell bye">휴</span></td>';
    });
    mxBody += "<tr><td>" + esc(nameOf(p))
      + (S.useLevel ? '<span class="lv">' + LVL[lvIn(S,p)] + "</span>" : "") + "</td>" + cells +
      "<td><b>" + total + "</b></td>" +
      '<td class="' + (streaks[p] >= 4 ? "diff neg" : "") + '">' + streaks[p] + "</td></tr>";
  }

  var legend = "";
  for (var lc=0; lc<courts; lc++){
    legend += '<span><i class="dot c' + (lc%4) + '"></i>' + esc(courtLabel(lc)) + '</span>';
  }

  host.innerHTML = vo +
    '<p class="eyebrow" style="margin:20px 0 8px">라운드별 대진</p>' +
    '<div class="card"><div class="scroller"><table class="sum"><thead><tr><th>R</th>' + head +
      '</tr></thead><tbody>' + body + '</tbody></table></div></div>' +
    '<p class="eyebrow" style="margin:24px 0 8px">개인별 출전 코트</p>' +
    '<div class="card"><div class="scroller"><table class="mx"><thead><tr>' + mxHead +
      '</tr></thead><tbody>' + mxBody + '</tbody></table></div>' +
      '<div class="legend">' + legend + '<span><i class="dot" style="background:var(--bg);border:1px solid var(--hair)"></i>휴식</span>' +
      '<span>숫자+A/B = 코트번호와 팀</span></div>' +
    '</div>';
  markScrollers();
}

/* ---------------- history rendering ---------------- */
function renderHistory(){
  var host = $("#hist");
  var keys = dateKeys();
  var items = keys.map(function(k){
    var sess = DB.sessions[k];
    var pr = progressOf(sess);
    var top = pr.done ? stats(sess)[0] : null;
    var pcS = perCourt(sess.mode), slotsS = sess.schedule.length * courtsOf(sess) * pcS;
    var L = "1인당 " + Math.floor(slotsS / sess.count) + "경기";
    return '<div class="hist-item' + (k === (S.sessionId || S.date) && S.schedule ? " on" : "") + '">' +
      '<button class="hist-open" data-d="' + k + '">' +
        '<div class="hist-d">' + fmtSessionKey(k) + '</div>' +
        '<div class="hist-m">' + modeLabel(sess) + " · " + sess.count + "명 · 코트 " + courtsOf(sess) + "면 · " + sess.schedule.length + "라운드 · " + L +
          " · " + pr.done + "/" + pr.all + "경기 입력" +
          (top ? ' · 1위 <b>' + esc(nameIn(sess, top.i)) + '</b>' : "") +
        '</div>' +
      '</button>' +
      '<button class="hist-del" data-d="' + k + '" aria-label="삭제">삭제</button>' +
    '</div>';
  }).join("");

  var cloudSection = Me
    ? '<p class="eyebrow" style="margin:20px 0 8px">내 클라우드 이력 (' + esc(Me.nickname) + ')</p>' +
      '<div id="cloud-hist"><div class="card"><p class="empty">불러오는 중…</p></div></div>'
    : '';

  host.innerHTML =
    cloudSection +
    '<p class="eyebrow" style="margin:20px 0 8px">지난 경기 기록 (' + keys.length + ')</p>' +
    (keys.length ? '<div class="hist">' + items + '</div>'
                 : '<div class="card"><p class="empty">아직 저장된 경기가 없습니다. 대진표를 만들면 그 날짜로 자동 저장됩니다.</p></div>') +
    '<div style="margin-top:16px"><button class="btn" id="hist-new" style="width:100%">새 경기 시작</button></div>';

  // 클라우드 이력 로드 (비동기)
  if (Me) loadCloudHistory(true);

  Array.prototype.forEach.call(host.querySelectorAll(".hist-open"), function(b){
    b.addEventListener("click", function(){
      startNewFromView();
      scrollMem = {};
      var key = this.dataset.d;
      hydrate(DB.sessions[key]);
      if (!S.sessionId) S.sessionId = key;   // legacy 세션이면 key 자체를 id로
      DB.current = S.sessionId; S.tab = "sched"; render(); save(); window.scrollTo({top:0});
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll(".hist-del"), function(b){
    b.addEventListener("click", function(){
      var d = this.dataset.d;
      if (!confirm(fmtSessionKey(d) + " 기록을 삭제합니다.")) return;
      delete DB.sessions[d];
      if ((S.sessionId || S.date) === d){ S.schedule = null; S.sessionId = null; DB.current = null; }
      renderHistory(); render(); Store.set(DB); toast("삭제했습니다");
    });
  });
  $("#hist-new").addEventListener("click", startNew);
}

function startNew(){
  if (!viewOnly && S.schedule && progressOf(S).done > 0
      && !confirm("입력한 점수는 " + fmtDateFull(S.date) + " 기록에 저장됩니다. 새 경기 설정으로 돌아갈까요?")) return;
  if (dirty) save();
  startNewFromView();
  scrollMem = {};
  courtTouched = false;
  S.schedule = null; S.sessionId = null; DB.current = null; S.savedAt = null; dirty = false;
  S.date = todayStr(); S.tab = "sched";
  render(); window.scrollTo({top:0});
}
function renderRank(){

  var rows = stats();
  var any = rows.some(function(r){ return r.g > 0; });
  host.innerHTML =
    (viewOnly ? '<div class="warnbox" style="margin-top:16px">공유받은 결과를 보고 있습니다. 점수는 수정할 수 없습니다.</div>' : "") +
    '<div class="sortline" style="margin-top:16px">' +
      '<span class="eyebrow" style="margin:0">정렬</span>' +
      '<div class="seg">' +
        '<button data-s="diff" aria-pressed="'+(S.sort==="diff")+'">득실 우선</button>' +
        '<button data-s="win" aria-pressed="'+(S.sort==="win")+'">승수 우선</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      (any ? "" : '<p class="empty">점수를 입력하면 순위가 바로 갱신됩니다.</p>') +
      '<div class="scroller"><table><thead><tr>' +
        '<th>#</th><th>이름</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득</th><th>실</th><th>득실</th>' +

      }).join("") +
      '</tbody></table></div>' +

  Array.prototype.forEach.call(host.querySelectorAll(".seg button"), function(b){

// 실제로 가로로 넘치는 표에만 스크롤 안내를 붙인다 (숨은 탭은 폭이 0이라 건너뛴다)
function markScrollers(){
  Array.prototype.forEach.call(d.querySelectorAll(".scroller"), function(sc){
    if (!sc.clientWidth) return;
    sc.classList.toggle("canscroll", sc.scrollWidth > sc.clientWidth + 4);
  });
}

function renderProgress(){
  if (!S.schedule){ $("#prog").textContent = ""; return; }
  var pr = progressOf(S);
  $("#prog").textContent = pr.done + " / " + pr.all + " 경기";
}

function fmtTime(ts){
  var d = new Date(ts), z = function(x){ return (x<10?"0":"")+x; };
  return z(d.getHours()) + ":" + z(d.getMinutes());
}

function renderSaveBar(){
  var show = !!S.schedule && S.tab === "sched" && !viewOnly;
  $("#savebar").hidden = !show;
  d.body.classList.toggle("has-savebar", show);
  if (!show) return;

  var pr = progressOf(S), btn = $("#save-btn"), msg = $("#savemsg");
  btn.disabled = pr.done === 0;
  btn.classList.toggle("saved", !dirty && !!S.savedAt);

  if (pr.done === 0){
    btn.textContent = "지금 저장";
    msg.textContent = "점수를 입력하면 자동으로 저장됩니다";
  } else if (dirty){
    btn.textContent = "지금 저장";
    msg.innerHTML = "<b>" + pr.done + "/" + pr.all + "</b> 경기 · 입력 중 (자동 저장됩니다)";
  } else {
    btn.textContent = "저장됨";
    msg.innerHTML = "<b>" + pr.done + "/" + pr.all + "</b> 경기"
      + (S.savedAt ? " · " + fmtTime(S.savedAt) + " 저장" : "");
  }

  // 클라우드 저장 버튼: 로그인 상태 + 최소 1경기 이상 결과 있을 때만 노출
  var cs = $("#cloud-save-btn");
  if (cs){
    cs.hidden = !(Me && pr.done > 0);
  }
}

/* ---------------- view switching ---------------- */
function render(){
  var hist = S.tab === "history";
  var intro = !S.mode && !hist;
  var live = !!S.schedule && !intro;
  $("#intro").hidden   = !intro;
  $("#setup").hidden   = intro || live || hist;
  $("#tabs").hidden    = !live;
  $("#foot").hidden    = !live || hist;
  $("#sched").hidden   = !live || S.tab !== "sched";
  $("#summary").hidden = !live || S.tab !== "summary";
  $("#rank").hidden    = !live || S.tab !== "rank";
  $("#hist").hidden    = !hist;
  $("#tab-sched").setAttribute("aria-selected", S.tab === "sched");
  $("#tab-summary").setAttribute("aria-selected", S.tab === "summary");
  $("#tab-rank").setAttribute("aria-selected", S.tab === "rank");
  $("#tab-hist").setAttribute("aria-selected", hist);

  $("#reshuffle").hidden = viewOnly;

// 인원 추가 (중간 참여): 완료된 라운드는 그대로, 진행중/앞으로의 라운드는 새 인원 반영해 재생성
$("#addp").addEventListener("click", function(){
  var raw = prompt("추가할 인원 이름 (콤마로 구분)\n예: 김민수, 이지훈");
  if (!raw) return;
  var newNames = raw.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  if (!newNames.length) return;
  var mixed = (S.mode === "double" && S.pair === "mixed");
  if (mixed){
    alert("혼복은 인원 추가 시 성별을 지정해야 합니다. 설정 화면에서 추가하세요.");
    return;
  }
  var completedCutoff = 0;
  for (var i=0; i<S.schedule.length; i++){
    if (S.schedule[i].matches.every(function(m){ return filled(m); })){ completedCutoff = i+1; }
    else break;
  }
  var oldCount = S.count;
  newNames.forEach(function(n){
    S.names.push(n); S.levels.push(2);
    if (mixed) S.genders.push("M");
  });
  S.count = S.names.length;
  // 전체 재생성 후 완료된 라운드는 원본으로 복원
  var completed = S.schedule.slice(0, completedCutoff);
  var full = buildSchedule(genCfg());
  S.schedule = completed.concat(full.slice(completedCutoff));
  dirty = true; save(); render();
  toast(newNames.length + "명 추가 · 남은 라운드 새로 짬 (기존 " + completedCutoff + "라운드 유지)");
});

$("#copy").addEventListener("click", function(){

          + S.count + "명 · 코트 " + S.courts + "면 · 1인당 " + loadFor(cfgNow()).min

          + m.b.map(nameOf).join("·") + "\n";
    });
    if (r.byes.length) txt += "휴식: " + r.byes.map(nameOf).join(", ") + "\n";
    txt += "\n";
  });
  txt += "[순위] " + (S.sort==="diff" ? "득실 우선" : "승수 우선") + "\n";
  rows.forEach(function(r){
    txt += r.rank + ". " + nameOf(r.i) + "  " + r.w + "승" + r.d + "무" + r.l + "패  "
        + "득실 " + (r.dif>0?"+":"") + r.dif + "\n";
  });
  copyText(txt, "결과를 복사했습니다");

function copyText(txt, okMsg){
  var done = function(){ toast(okMsg); };
  var fallback = function(){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ toast("복사에 실패했습니다"); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else fallback();
}

/* 앱이 이미 열려 있는 상태에서 공유 링크를 열면 해시만 바뀌고 새로고침되지 않는다 */
window.addEventListener("hashchange", function(){
  var m = /[#&]v1=([A-Za-z0-9\-_]+)/.exec(location.hash || "");
  if (!m) return;                       // 해시를 지운 경우(내 기록에 저장)는 그대로 둔다
  if (dirty && S.schedule) save();      // 내가 입력하던 점수는 먼저 지킨다
  shareHash = m; shareErr = false;
  openShared();
  scrollMem = {};
  render();
  window.scrollTo({top:0});
});

/* ---------------- boot ---------------- */
// 공유 링크(#v1=...)로 들어왔으면 그 결과를 읽기 전용으로 먼저 보여준다
var shareHash = /[#&]v1=([A-Za-z0-9\-_]+)/.exec((typeof location !== "undefined" && location.hash) || "");
var shareErr = false;

function openShared(){
  if (!shareHash) return false;
  try {
    hydrate(decodeShare(shareHash[1]));
    viewOnly = true;
    S.tab = "sched";
    return true;
  } catch(e){
    // 실패하면 내 옛 기록이 남의 결과로 오인되지 않도록 설정 화면으로 보낸다
    shareErr = true;
    S.mode = null; S.schedule = null; viewOnly = false;
    return false;
  }
}

Store.get().then(function(saved){
  if (saved && saved.sessions){
    DB = { sessions: saved.sessions || {}, current: saved.current || null };
    // 공유 링크로 들어왔으면 내 마지막 세션을 띄우지 않는다
    if (!shareHash && DB.current && DB.sessions[DB.current]) hydrate(DB.sessions[DB.current]);
  } else if (saved && saved.count){
    // 구버전(단일 세션) 데이터 → 오늘 날짜 기록으로 이관
    var d = saved.date || todayStr();
    saved.date = d;
    if (saved.schedule){ DB.sessions[d] = saved; DB.current = d; if (!shareHash) hydrate(saved); }
    else { S.count = saved.count; S.games = saved.games || saved.rounds || 4; S.names = saved.names || []; }
    Store.set(DB);
  }
  openShared();   // 공유 링크가 있으면 그 결과가 우선
  $("#date").value = S.date;
  render();
  bindAuthUI();
  refreshAuthUI();
  refreshMeFromServer().then(refreshAuthUI);
  // localStorage 사용 불가(시크릿 모드 등)이면 사용자에게 안내
  if (Store.kind() === "memory") setTimeout(function(){
    toast("저장이 안 됩니다. 시크릿 모드거나 저장 공간이 막혀 있어요.");
  }, 800);
});

      });
    }
  } else { cur.hidden = true; }
  $("#mRoom").hidden = false;
  refreshRoomList();
}
function closeRoomModal(){ $("#mRoom").hidden = true; }

function refreshRoomList(){
  var host = $("#mRoom-list");
  host.innerHTML = "<span style='color:var(--muted);font-size:12.5px'>불러오는 중…</span>";
  listOpenRooms(20).then(function(rows){
    if (!rows.length){ host.innerHTML = "<span style='color:var(--muted);font-size:12.5px'>열려있는 코트가 없어요</span>"; return; }
    host.innerHTML = "";
    rows.forEach(function(r){
      var b = d.createElement("button");
      var title = r.title ? " <span class='rt'>· " + esc(r.title) + "</span>" : "";
      var when  = r.updated_at ? new Date(r.updated_at) : null;
      var ago   = when ? " <span class='rt'>· " + when.toLocaleString() + "</span>" : "";
      b.innerHTML = "<span class='rc'>" + r.code + "</span>" + title + ago;
      b.addEventListener("click", function(){
        joinRoom(r.code).then(function(){ closeRoomModal(); refreshAuthUI(); toast("코트 " + r.code + " 접속"); })
          ["catch"](function(e){ $("#mRoom-err").textContent = e.message; });
      });
      host.appendChild(b);
    });
  });
}

// 방주 저장 시 참가자 → 로그인 계정 매핑 모달
function openMapModal(onSubmit){
  var list = $("#mMap-list");
  var opts = '<option value="">— 선택 안 함 —</option>' + Room.presence.map(function(p){
    return '<option value="' + esc(p.id) + '">' + esc(p.nickname) + '</option>';
  }).join("");
  var html = "";
  for (var i=0; i<S.count; i++){
    var nm = nameIn(S, i);
    // 이름으로 자동 추측: 참여자 닉네임과 로스터 이름이 정확히 같으면 pre-select
    var guess = "";
    Room.presence.forEach(function(p){ if (p.nickname === nm) guess = p.id; });
    var sel = opts.replace('value="' + guess + '"', 'value="' + guess + '" selected');
    html += '<div style="display:flex;align-items:center;gap:10px">' +
            '<span style="flex:0 0 100px;font-size:13px;font-weight:700">' + esc(nm) + '</span>' +
            '<select data-idx="' + i + '" style="flex:1 1 auto;padding:8px;border:1px solid var(--hair);border-radius:8px;font:inherit">' + sel + '</select>' +
            '</div>';
  }
  list.innerHTML = html;
  $("#mMap-err").textContent = "";
  $("#mMap").hidden = false;
}

// 기록 탭의 클라우드 이력 섹션 렌더
var cloudHistState = { rows: [], loading: false };
function renderCloudHistList(host){
  var rows = cloudHistState.rows;
  if (!rows.length){
    host.innerHTML = '<div class="card"><p class="empty">저장된 이력이 없습니다. 대진표 화면에서 <b>내 이력에 저장</b> 버튼을 눌러 저장하세요.</p></div>';
    return;
  }
  host.innerHTML = '<div class="hist">' + rows.map(function(s){
    var snap = s.snapshot || {};
    var pr = snap.schedule ? progressOf(snap) : {done:0, all:0};
    var meta = (snap.count ? snap.count + "명" : "?명")
      + (snap.schedule ? " · " + snap.schedule.length + "라운드" : "")
      + " · " + pr.done + "/" + pr.all + "경기 입력"
      + (s.room_code ? " · 코트 " + s.room_code : " · 솔로");
    return '<div class="hist-item">' +
      '<button class="hist-open" data-sid="' + esc(s.id) + '">' +
        '<div class="hist-d">' + fmtDateFull(s.played_on) + '</div>' +
        '<div class="hist-m">' + esc(meta) + '</div>' +
      '</button>' +
    '</div>';
  }).join("") + '</div>' +
  '<div style="margin-top:10px;text-align:center">' +
    '<button class="btn ghost" id="cloud-more" type="button" style="padding:8px 16px;font-size:13px">더 보기</button>' +
  '</div>';
}
function loadCloudHistory(reset){
  var host = $("#cloud-hist");
  if (!host) return;
  if (reset || !cloudHistState.rows.length){
    cloudHistState.rows = [];
    host.innerHTML = '<div class="card"><p class="empty">불러오는 중…</p></div>';
  }
  cloudHistState.loading = true;
  listMySessions(30, cloudHistState.rows.length).then(function(rows){
    cloudHistState.loading = false;
    cloudHistState.rows = cloudHistState.rows.concat(rows);
    var lastPage = rows.length < 30;
    renderCloudHistList(host);
    if (lastPage){
      var mb = $("#cloud-more"); if (mb && mb.parentNode) mb.parentNode.remove();
    } else {
      var mb2 = $("#cloud-more");
      if (mb2) mb2.addEventListener("click", function(){ if (!cloudHistState.loading) loadCloudHistory(false); });
    }
    // 세션 열기 → 로컬 DB에 복원 후 대진 화면으로 (전체 rows에서 검색)
    Array.prototype.forEach.call(host.querySelectorAll(".hist-open"), function(b){
      b.addEventListener("click", function(){
        var sid = this.dataset.sid;
        var s = cloudHistState.rows.filter(function(r){ return r.id === sid; })[0];
        if (!s || !s.snapshot) return;
        startNewFromView();
        scrollMem = {};
        hydrate(s.snapshot);
        DB.current = S.date; S.tab = "sched"; render(); window.scrollTo({top:0});
        toast("클라우드 세션 불러옴");
      });
    });
  })["catch"](function(e){
    host.innerHTML = '<div class="card"><p class="empty" style="color:#8f2f2f">로드 실패: ' + esc(e.message || e) + '</p></div>';
  });
}

/* ---------------- 관리자 모달 ---------------- */
var adminTab = "users";
function openAdminModal(){
  if (!Me || !Me.is_admin) return;
  adminTab = "users";
  d.querySelectorAll(".admin-tab").forEach(function(b){ b.classList.toggle("on", b.dataset.adm === "users"); });
  $("#mAdmin").hidden = false;
  loadAdminSection();
}
function closeAdminModal(){ $("#mAdmin").hidden = true; }

var adminUsersState = { search: "", offset: 0, limit: 50 };
function renderAdminUsers(){
  var wrap = $("#mAdmin-uwrap");
  if (!wrap) return;
  wrap.innerHTML = '<p class="empty">불러오는 중…</p>';
  listAllUsersAdmin(adminUsersState.search, adminUsersState.limit, adminUsersState.offset).then(function(result){
    var rows = result.rows, total = result.total;
    if (!rows.length){
      wrap.innerHTML = '<p class="empty">' + (adminUsersState.search ? '검색 결과 없음' : '회원이 없습니다') + '</p>';
      return;
    }
    var body = rows.map(function(u){
      return "<tr>" +
        "<td>" + esc(u.nickname) + (u.is_admin ? ' <span class="badge b-admin">ADMIN</span>' : "") + "</td>" +
        "<td>" + fmtDateFull(u.created_at.slice(0,10)) + "</td>" +
        "<td>" + (u.last_seen_at ? new Date(u.last_seen_at).toLocaleString() : "-") + "</td>" +
      "</tr>";
    }).join("");
    var from = adminUsersState.offset + 1;
    var to   = adminUsersState.offset + rows.length;
    var canPrev = adminUsersState.offset > 0;
    var canNext = to < total;
    wrap.innerHTML =
      '<div class="admin-scroll" style="margin-top:10px"><table class="admin-tbl">' +
        '<thead><tr><th>닉네임</th><th>가입일</th><th>마지막 접속</th></tr></thead>' +
        '<tbody>' + body + '</tbody></table></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px">' +
        '<span class="mAuth-hint">' + from + '~' + to + ' / 총 ' + total + '명</span>' +
        '<span style="display:flex;gap:6px">' +
          '<button class="btn ghost" id="adm-u-prev" ' + (canPrev ? '' : 'disabled') + ' style="padding:5px 12px;font-size:12px">이전</button>' +
          '<button class="btn ghost" id="adm-u-next" ' + (canNext ? '' : 'disabled') + ' style="padding:5px 12px;font-size:12px">다음</button>' +
        '</span>' +
      '</div>';
    if (canPrev) $("#adm-u-prev").addEventListener("click", function(){
      adminUsersState.offset = Math.max(0, adminUsersState.offset - adminUsersState.limit);
      renderAdminUsers();
    });
    if (canNext) $("#adm-u-next").addEventListener("click", function(){
      adminUsersState.offset += adminUsersState.limit;
      renderAdminUsers();
    });
  })["catch"](function(e){ wrap.innerHTML = '<p class="mAuth-err">' + esc(e.message || e) + '</p>'; });
}

function loadAdminSection(){
  var host = $("#mAdmin-body");
  host.textContent = "불러오는 중…";
  if (adminTab === "users"){
    // 검색 바 + 결과 영역
    host.innerHTML =
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<input id="mAdmin-usearch" placeholder="닉네임 검색" value="' + esc(adminUsersState.search) + '" ' +
          'style="flex:1;padding:8px 12px;border:1px solid var(--hair);border-radius:8px;font:inherit;font-size:13px">' +
      '</div>' +
      '<div id="mAdmin-uwrap"><p class="empty">불러오는 중…</p></div>';
    var inp = $("#mAdmin-usearch");
    var debT;
    inp.addEventListener("input", function(){
      clearTimeout(debT);
      var q = this.value.trim();
      debT = setTimeout(function(){
        adminUsersState.search = q; adminUsersState.offset = 0;
        renderAdminUsers();
      }, 250);
    });
    renderAdminUsers();
  } else {
    listAllRoomsAdmin().then(function(rows){
      if (!rows.length){ host.innerHTML = '<p class="empty">코트가 없습니다</p>'; return; }
      // owner_id → nickname 매핑 (한 번에 조회)
      var ownerIds = rows.map(function(r){return r.owner_id;}).filter(Boolean);
      var uniq = ownerIds.filter(function(v,i,a){return a.indexOf(v)===i;});
      var ownerP = uniq.length
        ? sb.from("app_users").select("id,nickname").in("id", uniq).then(function(res){
            var map = {}; (res.data||[]).forEach(function(u){ map[u.id] = u.nickname; }); return map;
          })
        : Promise.resolve({});
      ownerP.then(function(nickMap){
        var body = rows.map(function(r){
          var owner = r.owner_id ? (nickMap[r.owner_id] || "?") : "(없음)";
          var badge = r.is_open
            ? '<span class="badge b-open">진행중</span>'
            : '<span class="badge b-closed">종료</span>';
          var actions =
            (r.is_open ? '<button class="btn ghost adm-close" data-code="' + r.code + '" type="button" style="padding:4px 10px;font-size:11px;color:#8f2f2f">종료</button> ' : '') +
            '<button class="btn ghost adm-del" data-code="' + r.code + '" type="button" style="padding:4px 10px;font-size:11px;color:#8f2f2f;border-color:#8f2f2f">삭제</button>';
          return "<tr>" +
            "<td><span class='rc' style='font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800'>" + r.code + "</span></td>" +
            "<td>" + esc(r.title || "-") + "</td>" +
            "<td>" + esc(owner) + "</td>" +
            "<td>" + badge + "</td>" +
            "<td>" + new Date(r.updated_at).toLocaleString() + "</td>" +
            "<td>" + actions + "</td>" +
          "</tr>";
        }).join("");
        host.innerHTML = '<div class="admin-scroll"><table class="admin-tbl">' +
          '<thead><tr><th>코드</th><th>제목</th><th>코트주</th><th>상태</th><th>업데이트</th><th></th></tr></thead>' +
          '<tbody>' + body + '</tbody></table></div>' +
          '<p class="mAuth-hint" style="margin-top:10px">총 ' + rows.length + '개 (진행중 ' +
            rows.filter(function(r){return r.is_open;}).length + ')</p>';

        // 액션 버튼 바인딩
        host.querySelectorAll(".adm-close").forEach(function(b){
          b.addEventListener("click", function(){
            var code = this.dataset.code;
            if (!confirm("코트 " + code + " 을 강제 종료할까요? (목록에서 사라지며 이력만 남습니다)")) return;
            adminCloseRoom(code).then(function(){ toast("코트 " + code + " 종료됨"); loadAdminSection(); refreshAuthUI(); })
              ["catch"](function(e){ alert("실패: " + e.message); });
          });
        });
        host.querySelectorAll(".adm-del").forEach(function(b){
          b.addEventListener("click", function(){
            var code = this.dataset.code;
            if (!confirm("코트 " + code + " 를 완전 삭제할까요? (되돌릴 수 없습니다. 세션 이력은 보존됩니다)")) return;
            adminDeleteRoom(code).then(function(){ toast("코트 " + code + " 삭제됨"); loadAdminSection(); refreshAuthUI(); })
              ["catch"](function(e){ alert("실패: " + e.message); });
          });
        });
      });
    })["catch"](function(e){ host.innerHTML = '<p class="mAuth-err">' + esc(e.message||e) + '</p>'; });
  }
}

function bindAuthUI(){
  // 홈: 코트 목록 랜딩으로 복귀 (진행 중이면 확인)
  $("#btn-home").addEventListener("click", function(e){
    e.preventDefault();
    if (S.schedule && dirty && !confirm("입력한 점수가 저장되지 않았습니다. 홈으로 이동할까요?")) return;
    if (Room.channel){ leaveRoom(); }
    startNewFromView();
    scrollMem = {};
    S.schedule = null; S.mode = null; S.tab = "sched";
    introStep = 0;
    render(); refreshAuthUI();
    window.scrollTo({top:0});
  });
  $("#btn-auth").addEventListener("click", function(){
    if (Me){
      if (confirm(Me.nickname + " 로그아웃 하시겠어요?")){ signOut(); refreshAuthUI(); if (S.tab === "history") renderHistory(); toast("로그아웃"); }
    } else { openAuthModal(); }
  });
  $("#btn-admin").addEventListener("click", openAdminModal);
  $("#btn-me").addEventListener("click", openMyPage);
  // PIN 변경 submit
  $("#mPin-submit").addEventListener("click", function(){
    var cur = $("#mPin-cur").value.trim();
    var nw  = $("#mPin-new").value.trim();
    var nw2 = $("#mPin-new2").value.trim();
    if (nw !== nw2){ $("#mPin-err").textContent = "새 PIN이 서로 다릅니다"; return; }
    changePin(cur, nw).then(function(){
      $("#mPin").hidden = true;
      toast("PIN 변경 완료");
    })["catch"](function(e){ $("#mPin-err").textContent = e.message || String(e); });
  });
  // 관리자 탭 전환
  d.querySelectorAll(".admin-tab").forEach(function(b){
    b.addEventListener("click", function(){
      adminTab = this.dataset.adm;
      d.querySelectorAll(".admin-tab").forEach(function(x){ x.classList.toggle("on", x.dataset.adm === adminTab); });
      loadAdminSection();
    });
  });
  $("#btn-room").addEventListener("click", function(){
    if (!Me){ openAuthModal(); return; }
    openRoomModal();
  });
  // 클라우드 저장 버튼: 방주 + 방 참가자 2명 이상이면 매핑 모달, 아니면 나만 저장
  var cs = $("#cloud-save-btn");
  function doCloudSave(mappings){
    cs.disabled = true; cs.textContent = "저장 중…";
    saveSession(null, mappings).then(function(){
      cs.textContent = "저장됨";
      toast(mappings && mappings.length > 1
        ? "이력 저장 (" + mappings.length + "명)"
        : "내 이력에 저장됨");
      setTimeout(function(){ cs.disabled = false; cs.textContent = "내 이력에 저장"; }, 1500);
    })["catch"](function(e){
      cs.disabled = false; cs.textContent = "내 이력에 저장";
      toast("실패: " + (e.message || e));
    });
  }
  if (cs) cs.addEventListener("click", function(){
    if (!Me){ openAuthModal(); return; }
    // 방주 + 방 참가자 여럿이면 매핑 UI
    if (Room.code && Room.presence.length >= 2 && S.schedule && S.count){
      openMapModal(doCloudSave);
    } else {
      doCloudSave();
    }
  });
  // 매핑 모달 이벤트
  $("#mMap-skip").addEventListener("click", function(){ $("#mMap").hidden = true; doCloudSave(); });
  $("#mMap-submit").addEventListener("click", function(){
    var rows = Array.from($("#mMap-list").querySelectorAll("select[data-idx]"));
    var mappings = [];
    rows.forEach(function(sel){
      var uid = sel.value;
      var idx = +sel.dataset.idx;
      if (uid) mappings.push({ user_id: uid, player_name: nameIn(S, idx) });
    });
    $("#mMap").hidden = true;
    doCloudSave(mappings);
  });

  // 모달 닫기 (배경/버튼)
  d.querySelectorAll(".modal").forEach(function(m){
    m.addEventListener("click", function(e){
      if (e.target === m || e.target.hasAttribute("data-close")) m.hidden = true;
    });
  });

  // 인증 폼
  $("#mAuth-toggle").addEventListener("click", function(){
    authMode = (authMode === "signin") ? "signup" : "signin";
    $("#mAuth-title").textContent    = (authMode === "signup") ? "회원가입" : "로그인";
    $("#mAuth-submit").textContent   = (authMode === "signup") ? "가입하기" : "로그인";
    $("#mAuth-toggle").textContent   = (authMode === "signup") ? "로그인으로" : "회원가입으로";
    $("#mAuth-err").textContent = "";
  });
  $("#mAuth-submit").addEventListener("click", submitAuth);
  $("#mAuth-nick").addEventListener("keydown", function(e){ if (e.key === "Enter") $("#mAuth-pin").focus(); });
  $("#mAuth-pin").addEventListener("keydown",  function(e){ if (e.key === "Enter") submitAuth(); });

  // 방 폼
  $("#mRoom-create").addEventListener("click", function(){
    if (!S.schedule || !S.schedule.length){ $("#mRoom-err").textContent = "대진표를 먼저 만드세요"; return; }
    var t = prompt("코트 제목 (선택)", "") || "";
    createRoom(t).then(function(code){
      closeRoomModal(); refreshAuthUI();
      toast("코트 " + code + " 생성 완료");
    })["catch"](function(e){ $("#mRoom-err").textContent = e.message; });
  });
  $("#mRoom-join").addEventListener("click", function(){
    var c = $("#mRoom-code").value.trim().toUpperCase();
    if (c.length !== 6){ $("#mRoom-err").textContent = "6자리 코드"; return; }
    joinRoom(c).then(function(){ closeRoomModal(); refreshAuthUI(); toast("코트 " + c + " 접속"); })
      ["catch"](function(e){ $("#mRoom-err").textContent = e.message; });
  });
  $("#mRoom-code").addEventListener("keydown", function(e){ if (e.key === "Enter") $("#mRoom-join").click(); });
}
})();
</script>
