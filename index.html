<meta name="description" content="동호회 테니스 대진 생성과 결과 집계. 단식·동성복식·혼성복식 지원.">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23d9ec4b'/%3E%3Cpath d='M10 10a44 44 0 0 1 0 44M54 10a44 44 0 0 0 0 44' fill='none' stroke='%232f6bb3' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root{
    --court:#2f6bb3;
    --court-dark:#255891;
    --apron:#7fb0e0;
    --line:#ffffff;
    --bg:#eef1f5;
    --card:#ffffff;
    --ink:#0e1a26;
    --muted:#5a6875;      /* 흰 카드 위 5.7:1 · 배경 위 5.0:1 (WCAG AA) */
    --hair:#dfe4ea;
    --ball:#d9ec4b;
    --win:#1a7f4b;
    --shadow:0 1px 2px rgba(14,26,38,.06),0 8px 24px rgba(14,26,38,.06);
  }
  *{box-sizing:border-box}
  /* 저자 규칙(.setup{display:grid} 등)이 UA의 [hidden]{display:none}을 이기므로 명시적으로 막는다 */
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    font-size:15px;line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 64px}

  /* ---------- top bar ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(238,241,245,.92);
    backdrop-filter:saturate(1.4) blur(8px);
    border-bottom:1px solid var(--hair);
  }
  .bar{max-width:760px;margin:0 auto;padding:12px 14px 0;display:flex;align-items:center;gap:10px}
  .mark{
    width:26px;height:26px;border-radius:50%;background:var(--ball);
    position:relative;flex:0 0 auto;
  }
  .mark::before,.mark::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    border:2px solid var(--bg);
  }
  .mark::before{clip-path:inset(0 60% 0 0)}
  .mark::after{clip-path:inset(0 0 0 60%)}
  h1{
    font-size:15px;margin:0;font-weight:800;letter-spacing:-.02em;
  }
  .home-link{
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);
    flex:1 1 auto;min-width:0;cursor:pointer;padding:2px 0;border-radius:8px;
  }
  .home-link:hover h1{color:var(--court)}
  .home-link:focus-visible{outline:2px solid var(--court);outline-offset:2px}
  .prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  .tabs{max-width:760px;margin:0 auto;padding:4px 14px 0;display:flex;gap:8px}
  .tab{
    appearance:none;border:0;background:none;padding:11px 10px 9px;cursor:pointer;
    font:inherit;font-size:14px;font-weight:700;color:var(--muted);min-height:44px;
    border-bottom:2px solid transparent;letter-spacing:-.02em;white-space:nowrap;
    border-radius:8px 8px 0 0;
  }
  .tab[aria-selected="true"]{
    color:var(--court);border-bottom-color:var(--court);border-bottom-width:3px;
    background:rgba(47,107,179,.08);
  }

  /* ---------- shared bits ---------- */
  .eyebrow{
    font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin:0 0 8px;
  }
  .card{
    background:var(--card);border:1px solid var(--hair);border-radius:14px;
    padding:16px;box-shadow:var(--shadow);
  }
  /* ---------- 접이식 설정 카드 ---------- */
  .fold .foldhead{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;user-select:none}
  .fold .foldhead .eyebrow{margin:0}
  .fold .foldbody{margin-top:8px}
  .fold .foldsum{
    margin-left:auto;font-size:13px;font-weight:700;color:var(--ink);
    letter-spacing:-.01em;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .fold .chev{
    flex:0 0 auto;width:10px;height:10px;margin-right:2px;
    border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);
    transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s;
  }
  .fold.closed .chev{transform:rotate(-45deg) translate(-1px,-1px)}
  .fold.closed .foldbody{display:none}
  /* 접힌 카드는 밀도를 높여 스크롤이 늘지 않게 한다 */
  .fold.closed{padding:8px 16px}
  .fold.closed .foldhead{margin:0 -16px;padding:0 16px}
  .foldall{
    appearance:none;border:1px solid var(--hair);background:var(--card);color:var(--muted);
    font:inherit;font-size:13px;font-weight:700;padding:13px;border-radius:10px;cursor:pointer;
    width:100%;letter-spacing:-.01em;min-height:44px;
  }
  .btn{
    appearance:none;font:inherit;font-weight:700;cursor:pointer;
    border-radius:10px;padding:12px 16px;border:1px solid var(--hair);
    background:var(--card);color:var(--ink);letter-spacing:-.01em;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--court);border-color:var(--court);color:#fff;width:100%;padding:15px;font-size:16px}
  .btn.ghost{background:var(--card);border-color:var(--hair);color:var(--muted);padding:12px;font-size:13px}
  .btn.danger{color:#8f2f2f;border-color:#f3c9c9;background:#fff}
  .btn:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--court);outline-offset:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- setup ---------- */
  .setup{margin-top:16px;display:grid;gap:12px}
  .stepper{display:flex;align-items:center;gap:14px}
  .step-btn{
    width:44px;height:44px;border-radius:12px;border:1px solid var(--hair);
    background:var(--bg);font-size:20px;font-weight:700;cursor:pointer;color:var(--ink);
    line-height:1;
  }
  .step-btn:disabled{opacity:.35;cursor:default}
  .step-val{
    font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;
    min-width:2.2ch;text-align:center;letter-spacing:-.03em;
  }
  .step-unit{font-size:13px;color:var(--muted);font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    appearance:none;font:inherit;font-weight:700;cursor:pointer;
    padding:10px 0;width:52px;text-align:center;border-radius:10px;
    border:1px solid var(--hair);background:var(--bg);color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .chip[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:#fff}
  .chip:disabled{opacity:.32;cursor:not-allowed}
  .chip:disabled[aria-pressed="true"]{background:var(--bg);border-color:var(--hair);color:var(--muted)}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  @media (max-width:420px){.names{grid-template-columns:1fr}}
  .name-field{display:flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:10px;padding:0 8px;background:var(--bg)}
  .name-no{font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;width:2ch}
  .name-field input{
    border:0;background:none;font:inherit;font-weight:600;padding:11px 0;width:100%;color:var(--ink);
  }
  .name-field input:focus{outline:none}
  .name-field:focus-within{border-color:var(--court)}
  .hint{font-size:12.5px;color:var(--muted);margin:0}

  /* ---------- schedule ---------- */
  .round{margin-top:22px}
  /* 입력 중에도 몇 라운드인지 · 그 라운드가 다 찼는지 보이게 고정 */
  .round-head{
    position:sticky;top:var(--hh,84px);z-index:10;
    display:flex;align-items:center;gap:8px;
    margin:0 -14px 10px;padding:8px 14px;
    background:var(--bg);border-bottom:1px solid var(--hair);
  }
  .round-no{font-size:20px;font-weight:800;letter-spacing:-.03em}
  .round-tag{
    font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em;
    margin-left:auto;font-variant-numeric:tabular-nums;
  }
  .round-tag.full{color:var(--win)}
  .rest{
    margin-top:10px;font-size:12.5px;color:var(--muted);
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  }
  .rest b{color:var(--ink);font-weight:700}

  /* the court */
  .court{
    position:relative;background:var(--court);border-radius:6px;
    border:3px solid var(--line);
    padding:0;margin-bottom:10px;overflow:hidden;
    box-shadow:var(--shadow);
  }
  .court.done{background:var(--court-dark)}
  .court-label{
    position:absolute;top:7px;left:9px;z-index:2;
    font-size:11px;font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.95);
  }
  .side{
    display:flex;align-items:center;gap:10px;
    padding:20px 14px 14px;position:relative;
  }
  .side + .side{padding:14px 14px 16px}
  .players{flex:1 1 auto;min-width:0}
  .players .nm{
    color:#fff;font-weight:800;font-size:17px;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .players .sub{font-size:11.5px;color:rgba(255,255,255,.88);font-weight:700;letter-spacing:.1em;margin-top:2px}
  .score{
    width:64px;height:56px;flex:0 0 auto;
    border:2px solid rgba(255,255,255,.6);border-radius:8px;
    background:rgba(255,255,255,.14);
    color:#fff;font:inherit;font-size:28px;font-weight:800;
    text-align:center;font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  .score::-webkit-outer-spin-button,.score::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .score::placeholder{color:rgba(255,255,255,.8);font-weight:700}
  .score:focus{
    outline:none;border-color:var(--ball);background:rgba(255,255,255,.22);
    box-shadow:0 0 0 3px rgba(217,236,75,.55);
  }
  .score.win{border-color:var(--ball);background:var(--ball);color:#16240a}
  /* 공유 링크로 열어본 결과 — 눌러도 수정되지 않음을 형태로 알린다 */
  .score[readonly]{background:transparent;border-style:dashed;border-color:rgba(255,255,255,.5)}
  .score[readonly]:focus{border-color:rgba(255,255,255,.6);background:transparent;box-shadow:none}
  .net{
    height:0;border-top:2px solid var(--line);
    margin:0 -3px;position:relative;
  }
  .net::after{
    content:"";position:absolute;left:50%;top:-9px;width:3px;height:18px;
    background:var(--line);transform:translateX(-50%);
  }

  /* ---------- ranking ---------- */
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
  /* 실제로 넘칠 때만 안내를 띄운다 (JS가 .canscroll을 붙인다) */
  .scroller.canscroll::before{
    content:"← 좌우로 밀어서 나머지 열 보기";display:block;
    font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;
  }
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:11px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hair)}
  th{
    font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--muted);
    text-transform:uppercase;padding-top:0;
  }
  th:first-child,td:first-child{text-align:center;width:34px;padding-left:0}
  th:nth-child(2),td:nth-child(2){text-align:left;width:100%;padding-left:4px}
  td:nth-child(2){font-weight:700;letter-spacing:-.01em}
  tbody tr:last-child td{border-bottom:0}
  .rk{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:800;
    background:var(--bg);color:var(--muted);
  }
  .rk.top{background:var(--ball);color:#16240a}
  .diff.pos{color:var(--win);font-weight:800}
  .diff.neg{color:#b03b3b;font-weight:700}
  .sortline{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--hair);border-radius:9px;overflow:hidden}
  .seg button{
    appearance:none;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    border:0;background:var(--card);color:var(--muted);padding:8px 12px;
  }
  .seg button[aria-pressed="true"]{background:var(--court);color:#fff}
  .empty{color:var(--muted);font-size:13.5px;padding:8px 0;margin:0}

  /* ---------- date ---------- */
  .dateinput{
    font:inherit;font-size:17px;font-weight:700;color:var(--ink);
    border:1px solid var(--hair);border-radius:10px;background:var(--bg);
    padding:12px;width:100%;letter-spacing:-.01em;
  }
  .dateinput:focus{outline:none;border-color:var(--court)}
  .datechip{
    font-size:12px;font-weight:800;color:var(--court);
    background:rgba(47,107,179,.1);border-radius:999px;padding:4px 9px;
    white-space:nowrap;
  }
  .datechip.vo{color:#8f2f2f;background:#fdecec}   /* 열람용(공유 링크) 표시 */

  /* ---------- summary ---------- */
  .sum{font-size:13px;width:auto;margin:0 auto}
  .sum th,.sum td{text-align:left;padding:10px 14px;vertical-align:middle}
  .sum th:first-child,.sum td:first-child{
    width:34px;text-align:center;padding-left:0;
    position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--hair);
  }
  .sum td:first-child{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .sum td.vscol{white-space:nowrap}
  .vs{white-space:nowrap}
  .vs .t{font-weight:700;letter-spacing:-.01em}
  .vs .t.w{color:var(--win)}
  .vs .sc{
    font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);
    background:var(--bg);border-radius:6px;padding:2px 7px;margin:0 6px;font-size:12.5px;
  }
  .vs .sc.pending{color:var(--muted);font-weight:600}
  .sum td.byecol{color:var(--muted);font-size:12px;text-align:left;white-space:nowrap;padding-left:24px}

  .mx{font-size:12px;table-layout:fixed;width:100%}
  .mx th,.mx td{padding:8px 4px;text-align:center;white-space:nowrap;overflow:hidden}
  .mx th:first-child,.mx td:first-child{
    text-align:left;padding-left:0;padding-right:8px;font-weight:700;
    box-shadow:1px 0 0 var(--hair);
  }
  .cell{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:30px;height:24px;border-radius:6px;
    font-size:11px;font-weight:800;color:#fff;letter-spacing:.02em;
  }
  .cell.bye{background:var(--bg);color:var(--muted);font-weight:700}
  .c0{background:#2f6bb3}.c1{background:#2f8f6a}.c2{background:#b0762c}.c3{background:#6d5199}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* ---------- history ---------- */
  .hist{display:grid;gap:8px;margin-top:16px}
  .hist-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--hair);border-radius:12px;
    padding:14px;box-shadow:var(--shadow);
  }
  .hist-item.on{border-color:var(--court);box-shadow:0 0 0 1px var(--court),var(--shadow)}
  .hist-open{flex:1 1 auto;min-width:0;border:0;background:none;font:inherit;text-align:left;cursor:pointer;padding:0}
  .hist-d{font-weight:800;font-size:15px;letter-spacing:-.02em}
  .hist-m{font-size:12px;color:var(--muted);margin-top:3px}
  .hist-m b{color:var(--ink);font-weight:700}
  .hist-del{
    appearance:none;border:0;background:none;cursor:pointer;flex:0 0 auto;
    color:#8f2f2f;font:inherit;font-size:12.5px;font-weight:700;
    min-width:44px;min-height:44px;padding:12px 10px;
  }
  footer{margin-top:26px;display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
  /* ---------- intro (종목 선택) ---------- */
  .intro{margin-top:40px}
  .intro h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
  .intro .lead{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .pickers{display:grid;gap:10px}
  .pick{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1px solid var(--hair);border-radius:14px;
    padding:18px;box-shadow:var(--shadow);font:inherit;color:var(--ink);
  }
  .pick:hover{border-color:var(--court)}
  .pick-ico{
    flex:0 0 auto;width:52px;height:38px;border-radius:4px;border:2px solid var(--line);
    background:var(--court);position:relative;
  }
  .pick-ico::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
  .pick-ico i{
    position:absolute;width:7px;height:7px;border-radius:50%;background:var(--ball);
  }
  .pick-t{font-weight:800;font-size:16px;letter-spacing:-.02em}
  .pick-d{font-size:12.5px;color:var(--muted);margin-top:3px}
  .intro-back{margin-top:14px}

  /* ---------- gender toggle ---------- */
  .gbtn{
    appearance:none;border:1px solid var(--hair);background:var(--card);cursor:pointer;
    font:inherit;font-size:13px;font-weight:800;border-radius:9px;
    padding:0;width:44px;min-height:44px;flex:0 0 auto;color:var(--muted);
  }
  .gbtn.m{background:#e8f0fa;border-color:#bcd6ef;color:#1d5b96}
  .gbtn.f{background:#fbe9f0;border-color:#f0c2d4;color:#a83a66}

  /* ---------- 실력 등급 ---------- */
  .lvbtn{
    appearance:none;border:1px solid var(--hair);background:var(--card);cursor:pointer;
    font:inherit;font-size:13px;font-weight:800;border-radius:9px;
    padding:0;width:44px;min-height:44px;flex:0 0 auto;color:var(--muted);
  }
  .lvbtn.a{background:#eaf5ec;border-color:#c2e0c9;color:#256b39}
  .lvbtn.b{background:var(--bg);border-color:var(--hair);color:var(--muted)}
  .lvbtn.c{background:#fdf1e5;border-color:#f0d6b6;color:#96601f}
  .lv{font-size:11px;font-weight:800;color:var(--muted);vertical-align:super;margin-left:2px}
  /* ---------- 고정 조 ---------- */
  .pairline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .pairchip{
    font-size:11.5px;font-weight:700;color:var(--muted);background:var(--bg);
    border:1px solid var(--hair);border-radius:7px;padding:4px 8px;
  }
  .warnbox{
    background:#fdecec;border:1px solid #f3c9c9;color:#8f2f2f;
    border-radius:10px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.45;
  }

  /* ---------- save bar ---------- */
  .savebar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.94);
    backdrop-filter:saturate(1.4) blur(8px);
    border-top:1px solid var(--hair);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .savebar-in{
    max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;
  }
  .savemsg{flex:1 1 auto;min-width:0;font-size:13.5px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
  .savemsg b{color:var(--ink);font-weight:700}
  .savebar .btn.primary{width:auto;flex:0 0 auto;padding:13px 22px;font-size:15px}
  .btn.primary:disabled{background:var(--card);border-color:var(--hair);color:var(--muted);cursor:default}
  .btn.primary.saved{background:var(--win);border-color:var(--win)}

<script>
(function(){
"use strict";
var d = document;
var $ = function(s){ return d.querySelector(s); };
var dirty = false;   // 저장하지 않은 점수 변경 여부

/* ---------------- 앱 상수 (마법 문자열 제거) ---------------- */
var CONST = {
  STORAGE: {
    SESSIONS: "tennis:sessions",   // 로컬 저장 DB 키
    AUTH:     "tennis:auth"        // 로그인 상태 (닉네임·id만)
  },
  ROOM: {
    CODE_LEN:   6,
    CODE_CHARS: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789",   // 0/O/1/I 제외
    ECHO_MS:    500,                                    // 자기 push 에코 무시 임계
    MAX_STREAK: 3                                       // 하드 연속 출전 상한
  },
  AUTH: {
    NICK_MIN: 2, NICK_MAX: 20,
    PIN_RE:   /^\d{4}$/
  },
  MAX_COUNT: 24,                    // 최대 참가 인원
  GAMES: [2, 3, 4, 5]               // 1인당 경기 수 옵션
};

// 공통 에러 처리: catch 콜백 만들어 반환 (toast + 콘솔)
function handleErr(prefix){
  return function(e){
    var msg = (e && e.message) ? e.message : String(e);
    if (typeof toast === "function") toast((prefix ? prefix + ": " : "") + msg);
    if (window.console) console.warn("[app]", prefix || "", e);
  };
}

/* ---------------- Supabase 클라이언트 & 인증 ---------------- */
// window.supabase = SDK 네임스페이스, sb = 우리 앱 전용 클라이언트 인스턴스
var sb = null;
if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient){
  try {
    sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
      realtime: { params: { eventsPerSecond: 10 } }
    });
  } catch(e){ sb = null; }
}

// 로그인 상태 (localStorage에 user id/nickname만 저장, PIN은 저장 안 함)
var AUTH_KEY = CONST.STORAGE.AUTH;
var Me = null;   // { id, nickname }
try {
  var raw = window.localStorage && window.localStorage.getItem(AUTH_KEY);
  if (raw) Me = JSON.parse(raw);
} catch(e){}

function setMe(u){
  Me = u;
  try {
    if (u) window.localStorage.setItem(AUTH_KEY, JSON.stringify({id:u.id, nickname:u.nickname, is_admin:!!u.is_admin}));
    else   window.localStorage.removeItem(AUTH_KEY);
  } catch(e){}
}

// 서버에서 is_admin 조회 (컬럼이 없어도 false로 그레이스풀 처리)
// app_users_public 뷰 사용 (pin_hash/salt 노출 없음)
function fetchIsAdmin(userId){
  if (!sb || !userId) return Promise.resolve(false);
  return sb.from("app_users_public").select("is_admin").eq("id", userId).maybeSingle()
    .then(function(res){ return !!(res.data && res.data.is_admin); })
    ["catch"](function(){
      // 뷰가 아직 안 만들어졌으면 legacy 테이블 폴백
      return sb.from("app_users").select("is_admin").eq("id", userId).maybeSingle()
        .then(function(r2){ return !!(r2.data && r2.data.is_admin); })
        ["catch"](function(){ return false; });
    });
}

// 앱 시작 시 서버에서 사용자·admin 재확인
function refreshMeFromServer(){
  if (!sb || !Me) return Promise.resolve();
  return sb.from("app_users_public").select("id,nickname,is_admin").eq("id", Me.id).maybeSingle()
    .then(function(res){
      if (res.data){
        setMe({ id: res.data.id, nickname: res.data.nickname, is_admin: !!res.data.is_admin });
        return;
      }
      // 뷰 없으면 legacy 테이블 폴백
      return sb.from("app_users").select("id,nickname").eq("id", Me.id).maybeSingle()
        .then(function(r2){
          if (!r2.data){ setMe(null); return; }
          return fetchIsAdmin(r2.data.id).then(function(isAdmin){
            setMe({ id: r2.data.id, nickname: r2.data.nickname, is_admin: isAdmin });
          });
        });
    })["catch"](function(){ /* 오프라인은 무시 */ });
}

// SHA-256 해싱 (PIN + salt) — 4자리 PIN이라 salt가 필수
function toHex(buf){
  var a = new Uint8Array(buf), s = "";
  for (var i=0;i<a.length;i++){ s += ("0"+a[i].toString(16)).slice(-2); }
  return s;
}
function randSalt(){
  var a = new Uint8Array(16);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return toHex(a.buffer);
}
function hashPin(pin, salt){
  var enc = new TextEncoder().encode(pin + ":" + salt);
  return (window.crypto || window.msCrypto).subtle.digest("SHA-256", enc).then(toHex);
}

// PostgREST 에러 메시지를 사용자 친화적 문구로 변환
function mapAuthErr(err){
  var msg = (err && err.message) ? err.message : String(err);
  if (/PIN_INVALID/.test(msg)) return new Error("PIN은 숫자 4자리");
  if (/NICKNAME_INVALID/.test(msg)) return new Error("닉네임은 2~20자");
  if (/NICKNAME_TAKEN/.test(msg)) return new Error("이미 쓰는 닉네임입니다");
  if (/PIN_MISMATCH/.test(msg)) return new Error("현재 PIN이 틀립니다");
  if (/NOT_FOUND/.test(msg)) return new Error("계정을 찾을 수 없습니다");
  return new Error(msg);
}

// 회원가입: 서버측 RPC create_account (pin_hash 는 서버에서 생성)
function signUp(nickname, pin){
  if (!sb) return Promise.reject(new Error("Supabase 설정이 없습니다"));
  if (!/^\d{4}$/.test(pin)) return Promise.reject(new Error("PIN은 숫자 4자리"));
  if (!nickname || nickname.length < 2 || nickname.length > 20) return Promise.reject(new Error("닉네임은 2~20자"));
  return sb.rpc("create_account", { p_nickname: nickname, p_pin: pin })
    .then(function(res){
      if (res.error) throw mapAuthErr(res.error);
      var data = res.data || {};
      var u = { id: data.id, nickname: data.nickname, is_admin: !!data.is_admin };
      setMe(u); return u;
    });
}

// 로그인: 서버측 RPC verify_pin (pin_hash 클라이언트 노출 없음)
function signIn(nickname, pin){
  if (!sb) return Promise.reject(new Error("Supabase 설정이 없습니다"));
  return sb.rpc("verify_pin", { p_nickname: nickname, p_pin: pin })
    .then(function(res){
      if (res.error) throw mapAuthErr(res.error);
      if (!res.data) throw new Error("닉네임 또는 PIN이 틀립니다");
      var data = res.data;
      var u = { id: data.id, nickname: data.nickname, is_admin: !!data.is_admin };
      setMe(u); return u;
    });
}

function signOut(){
  if (Room.channel){ try { Room.channel.unsubscribe(); } catch(e){} Room.channel = null; }
  Room.code = null;

// PIN 변경: 서버측 RPC change_pin
function changePin(curPin, newPin){
  if (!sb || !Me) return Promise.reject(new Error("로그인 필요"));
  if (!/^\d{4}$/.test(newPin)) return Promise.reject(new Error("PIN은 숫자 4자리"));
  return sb.rpc("change_pin", { p_user_id: Me.id, p_cur_pin: curPin, p_new_pin: newPin })

      return res.data;
    });
}

// 방 접속 — 상태 로드 + Realtime 구독
function joinRoom(code){
  if (!sb) return Promise.reject(new Error("Supabase 설정이 없습니다"));
  return sb.from("rooms").select("state,title,owner_id").eq("code", code).maybeSingle()
    .then(function(res){
      if (res.error) throw new Error(res.error.message);
      if (!res.data)  throw new Error("없는 코트입니다");
      // 원격 상태를 로컬에 반영
      Room.suppressSync = true;
      try { hydrate(res.data.state); } finally { Room.suppressSync = false; }
      Room.code = code;
      // Realtime 구독 + presence
      if (Room.channel){ try { Room.channel.unsubscribe(); } catch(e){} }
      Room.channel = sb.channel("room:" + code, { config: { presence: { key: (Me && Me.id) || ("g:" + Math.random().toString(36).slice(2)) } } })
        .on("postgres_changes",
            { event: "UPDATE", schema: "public", table: "rooms", filter: "code=eq." + code },
            function(payload){
              if (Date.now() - Room.lastPushAt < CONST.ROOM.ECHO_MS) return;
              Room.suppressSync = true;
              try { hydrate(payload.new.state); render(); } finally { Room.suppressSync = false; }
            })
        .on("presence", { event: "sync" }, function(){
          var state = Room.channel.presenceState() || {};
          var seen = {}, arr = [];
          Object.keys(state).forEach(function(k){
            (state[k] || []).forEach(function(u){
              if (u && u.id && !seen[u.id]){ seen[u.id]=1; arr.push({ id:u.id, nickname:u.nickname }); }
            });
          });
          Room.presence = arr;
        })
        .subscribe(function(status){
          if (status === "SUBSCRIBED" && Me){
            Room.channel.track({ id: Me.id, nickname: Me.nickname });
          }
        });
      render();
    });
}

function leaveRoom(){
  if (Room.channel){ try { Room.channel.unsubscribe(); } catch(e){} Room.channel = null; }
  Room.code = null;
  render();
}

// 방 상태 push (save()에서 호출)
// 최적화: 스냅샷 해시가 이전과 같으면 스킵 → 무의미한 트래픽/DB write 제거
var _lastPushedHash = null;
function stateHash(snap){
  // 대진표+점수+이름 위주로 가벼운 시그니처 (JSON stringify 대신 필드 순회)
  var h = "";
  if (snap.schedule) snap.schedule.forEach(function(rd){
    rd.matches.forEach(function(m){ h += (m.sa || "") + "," + (m.sb || "") + "|"; });
  });
  h += "N:" + (snap.names || []).join(",") + "|C:" + (snap.count || 0) + "|CT:" + (snap.courtNames || []).join(",");
  return h;
}
function pushRoomState(){
  if (!sb || !Room.code || Room.suppressSync) return;
  var snap = snapshot();
  var h = stateHash(snap);
  if (h === _lastPushedHash) return;    // 실질 변화 없음
  _lastPushedHash = h;
  Room.lastPushAt = Date.now();
  sb.from("rooms").update({ state: snap }).eq("code", Room.code).then(function(){});
}

// 방 닫기 (owner만) — 목록에서 사라지지만 sessions/user_sessions 이력은 보존
function closeRoom(){
  if (!sb || !Room.code || !Me) return Promise.reject(new Error("로그인·코트 필요"));
  var code = Room.code;

      if (!res.data || !res.data.length) throw new Error("코트 주인만 종료할 수 있습니다");
      leaveRoom();
    });
}

// 방에 있으면 (room_code, played_on)이 같은 세션을 재사용, 없으면 새로 만든다.
// mappings: [{user_id, player_name}, ...] — 방주 저장 시 여러 참가자를 한 번에 링크
// mappings가 없으면 나 자신만 링크 (기존 동작)
function saveSession(playerName, mappings){
  if (!sb || !Me) return Promise.reject(new Error("로그인이 필요합니다"));
  var snap = snapshot();
  if (!snap.schedule || !snap.schedule.length) return Promise.reject(new Error("대진표가 없습니다"));
  var name = (playerName || Me.nickname).slice(0, 20);

  // 링크 목록: 기본은 나 자신, mappings 있으면 그것 + 나
  function linkList(){
    if (mappings && mappings.length){
      var seen = {};
      var arr = mappings.filter(function(m){ return m && m.user_id; }).map(function(m){
        return { user_id: m.user_id, player_name: (m.player_name || "").slice(0,20) };
      }).filter(function(m){ if (seen[m.user_id]) return false; seen[m.user_id]=1; return true; });
      // 저장 주도자(나)도 없으면 추가
      if (!seen[Me.id]) arr.push({ user_id: Me.id, player_name: name });
      return arr;
    }
    return [{ user_id: Me.id, player_name: name }];
  }

  function link(sessId){
    var rows = linkList().map(function(l){
      return { user_id: l.user_id, session_id: sessId, player_name: l.player_name };
    });
    return sb.from("user_sessions")
      .upsert(rows, { onConflict: "user_id,session_id" })
      .then(function(){ return sessId; });
  }

  // 방에 있으면 기존 세션 재사용
  if (Room.code){
    return sb.from("sessions").select("id")
      .eq("room_code", Room.code).eq("played_on", snap.date)
      .order("created_at", {ascending:false}).limit(1).maybeSingle()
      .then(function(res){
        if (res.data){
          // 스냅샷 업데이트 (최신 점수 반영)
          return sb.from("sessions").update({ snapshot: snap }).eq("id", res.data.id)
            .then(function(){ return link(res.data.id); });
        }
        // 없으면 새로 만들기
        return sb.from("sessions").insert({
          room_code: Room.code, played_on: snap.date, snapshot: snap
        }).select().single().then(function(r){
          if (r.error) throw new Error(r.error.message);
          return link(r.data.id);
        });
      });
  }

  // 솔로: 매번 새 세션
  return sb.from("sessions").insert({
    room_code: null, played_on: snap.date, snapshot: snap
  }).select().single().then(function(r){
    if (r.error) throw new Error(r.error.message);
    return link(r.data.id);
  });
}

/* ---------------- storage (works inside Claude artifacts; falls back to memory) ------- */
var KEY = CONST.STORAGE.SESSIONS;
var mem = {};

// 저장 위치를 순서대로 시도한다.
//  1) window.storage  — Claude 아티팩트 미리보기 환경
//  2) localStorage    — 일반 브라우저(직접 호스팅·파일 열기). 기기별로 따로 저장된다
//  3) 메모리          — 위 둘 다 막힌 경우(사파리 시크릿 모드 등). 새로고침 시 사라진다
var hasLocal = (function(){
  try { var k="__t"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();

var Store = {
  get: function(){
    if (window.storage && window.storage.get) {
      return window.storage.get(KEY).then(function(r){
        return r && r.value ? JSON.parse(r.value) : null;
      })["catch"](function(){ return null; });
    }
    if (hasLocal){
      try {
        var raw = window.localStorage.getItem(KEY);
        return Promise.resolve(raw ? JSON.parse(raw) : null);
      } catch(e){ /* 손상된 데이터는 무시 */ }
    }
    return Promise.resolve(mem[KEY] || null);
  },
  set: function(v){
    mem[KEY] = v;
    if (window.storage && window.storage.set) {
      return window.storage.set(KEY, JSON.stringify(v))["catch"](function(){});
    }
    if (hasLocal){
      try { window.localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){ /* 용량 초과 */ }
    }
    return Promise.resolve();
  },
  kind: function(){
    if (window.storage && window.storage.get) return "preview";
    return hasLocal ? "local" : "memory";
  }
};

/* ---------------- dates ---------------- */
function todayStr(){
  var d = new Date(), z = function(x){ return (x<10?"0":"")+x; };
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}
function fmtDate(s){
  var p = String(s).split("-");
  if (p.length !== 3) return s;
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  return (+p[1]) + "월 " + (+p[2]) + "일 (" + "일월화수목금토".charAt(dt.getDay()) + ")";
}
function fmtDateFull(s){
  var p = String(s).split("-");
  return p.length === 3 ? p[0] + ". " + fmtDate(s) : s;
}

/* ---------------- state ---------------- */
var DB = { sessions: {}, current: null };   // sessions: { "YYYY-MM-DD": snapshot }
// 세션 키 생성 — 하루에 여러 세션 지원 (YYYY-MM-DD#HHMMSS)
function newSessionId(date){
  var d = new Date();
  function pad(n){ return (n<10?"0":"") + n; }
  return (date || todayStr()) + "#" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}
// 세션 키가 legacy(순수 날짜)인지 확인
function isLegacyKey(k){ return typeof k === "string" && k.length === 10 && k.indexOf("#") < 0; }
// 세션 키에서 날짜 부분 추출
function dateOfKey(k){ return isLegacyKey(k) ? k : String(k).split("#")[0]; }

var S = {
  date: todayStr(),
  sessionId: null,  // DB.sessions의 키. null이면 저장 시 새로 발급
  mode: null,       // "single" | "double"  (null이면 종목 선택 화면)
  pair: "same",     // 복식일 때 "same"(동성) | "mixed"(혼성)
  genders: [],      // 혼복 전용: "M" | "F"
  count: 8,
  courts: 2,
  courtNames: [],   // 각 코트 커스텀 이름 (빈 값이면 기본 "코트 N")
  games: 4,        // 1인당 경기 수 (목표)
  names: [],
  levels: [],       // 실력 등급 3(A) | 2(B) | 1(C)
  useLevel: false,  // 등급으로 팀 전력을 맞출지
  mixPartner: "random",  // 혼복 전용: "random"(매번 새 파트너) | "fixed"(고정 조)
  samePartner: "random", // 동성복식 6인 전용: "random" | "fixed"(2인 고정페어)
  schedule: null,   // [{ matches:[{a:[i,j],b:[k,l],sa:null,sb:null}], byes:[i] }]
  sort: "diff",     // "diff" | "win"
  savedAt: null,    // 마지막 결과 저장 시각
  tab: "sched"
};
var viewOnly = false;   // 공유 링크로 열었을 때 (읽기 전용, 기기에 저장하지 않음)

function snapshot(){
  return { date:S.date, sessionId:S.sessionId,
           mode:S.mode, pair:S.pair, genders:S.genders.slice(),
           count:S.count, courts:S.courts, courtNames:(S.courtNames||[]).slice(),
           games:S.games, names:S.names.slice(),
           levels:S.levels.slice(), useLevel:S.useLevel, mixPartner:S.mixPartner, samePartner:S.samePartner,
           schedule:S.schedule, sort:S.sort, savedAt:S.savedAt };
}
function hydrate(s){
  S.date = s.date;
  S.sessionId = s.sessionId || null;   // legacy 세션은 sessionId 없음
  S.count = s.count; S.games = s.games || s.rounds || 4;
  S.mode = s.mode || "double"; S.pair = s.pair || "same";
  S.genders = (s.genders || []).slice();
  S.courts = s.courts || maxCourts(s.count, S.mode);
  S.courtNames = (s.courtNames || []).slice();
  S.names = (s.names || []).slice(); S.schedule = s.schedule || null;
  S.levels = (s.levels || []).slice();
  S.useLevel = !!s.useLevel;
  S.mixPartner = s.mixPartner === "fixed" ? "fixed" : "random";
  S.samePartner = s.samePartner === "fixed" ? "fixed" : "random";
  S.sort = s.sort || "diff"; S.savedAt = s.savedAt || null;
  dirty = false;
}
function save(){
  if (viewOnly) return;   // 공유 링크로 본 결과는 기기에 남기지 않는다
  if (S.schedule && S.date){
    if (!S.sessionId) S.sessionId = newSessionId(S.date);
    DB.sessions[S.sessionId] = snapshot();
    DB.current = S.sessionId;
  }
  Store.set(DB);
  // 방에 접속 중이면 원격 상태도 push (실시간 동기화)
  pushRoomState();
}
/* 점수는 입력이 멈추면 스스로 저장된다 — 경기 중 '저장' 버튼을 누를 이유를 없앤다 */
var saveT;
function autosave(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    if (viewOnly || !dirty || !S.schedule) return;
    S.savedAt = Date.now(); dirty = false;
    save(); renderSaveBar();
  }, 700);
}

var courtTouched = false;   // 사용자가 코트 수를 직접 고르면 자동 보정 중단
var scrollMem = {};         // 탭별 스크롤 위치 (탭을 왕복해도 보던 코트로 돌아온다)
// 세션 키 최신순 정렬. 신규 키(YYYY-MM-DD#HHMMSS)는 시간까지 반영,
// legacy(YYYY-MM-DD)는 문자열 비교로도 신규 앞에 오게 sort → reverse
function dateKeys(){
  return Object.keys(DB.sessions).sort().reverse();
}
// 세션 키를 "8월 26일 (수) 14:30" 형태로
function fmtSessionKey(k){
  var date = dateOfKey(k);
  var label = fmtDateFull(date);
  var t = isLegacyKey(k) ? "" : String(k).split("#")[1];
  if (t && t.length >= 4) label += " " + t.slice(0,2) + ":" + t.slice(2,4);
  return label;
}

/* ---------------- matching algorithm ---------------- */
function shuffle(a){
  a = a.slice();
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
function zeros(n){
  var m=[]; for(var i=0;i<n;i++){ m.push(new Array(n).fill(0)); } return m;
}
var PAIRINGS = [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];

var W_PAIR     = 40;  // 같은 사람과 다시 페어
var W_OPPO     = 4;   // 같은 사람과 다시 상대
var W_BAL      = 12;  // 팀 전력 1점 차이당 (실력 등급 사용 시)
var W_GROUP    = 2;   // 같은 게임에 함께한 적 있는 쌍 (그룹 다양화)
var W_ADJACENT = 3;   // 직전 라운드에 같은 매치였던 쌍 (실전 만족도 개선)

// 완전탐색 임계치: 인원×코트 조합이 이 값 이하이면 결정적 최적해
var EXHAUST_MAX_N = 8;

// n개 중 k개 조합을 배열로 반환
function combos(arr, k){
  var out = [];
  function rec(start, pick){
    if (pick.length === k){ out.push(pick.slice()); return; }
    for (var i=start; i<=arr.length - (k - pick.length); i++){
      pick.push(arr[i]); rec(i+1, pick); pick.pop();
    }
  }
  rec(0, []);
  return out;
}

// 실력 등급: 3=A(상) 2=B(중) 1=C(하). 미입력은 B로 본다
function lvIn(sess, i){
  var v = (sess.levels || [])[i];
  return (v === 1 || v === 2 || v === 3) ? v : 2;
}
function lvArr(sess){
  var a = []; for (var i=0;i<sess.count;i++) a.push(lvIn(sess, i));
  return a;
}
// 등급이 실제로 지정되었는가 (전원 B면 전력 맞추기가 아무 일도 하지 않는다)
function levelSet(sess){
  for (var i=0;i<sess.count;i++){ if (lvIn(sess, i) !== 2) return true; }
  return false;
}
// 팀 전력 차이 비용 (levels 없으면 0)
function balCost(lv, A, B){
  if (!lv) return 0;
  var s = 0, i;
  for (i=0;i<A.length;i++) s += lv[A[i]];
  for (i=0;i<B.length;i++) s -= lv[B[i]];
  return Math.abs(s) * W_BAL;
}

// cfg = { n, rounds, courts, type:'single'|'same'|'mixed', genders:[], lv:[]|null, anchor, cap }
// anchor → 1라운드 코트1 고정 (복식 1·2번 vs 3·4번 / 단식 1번 vs 2번)
// cap    → 4라운드 연속 출전이 나오지 않도록 휴식자를 우선 배정
// lv     → 실력 등급 배열 (전달되면 팀 전력 편차도 비용에 넣는다)
function attempt(cfg){
  var n = cfg.n, courts = cfg.courts, rounds = cfg.rounds;
  var single = cfg.type === "single", mixed = cfg.type === "mixed";
  var lv = cfg.lv || null;
  var seed = cfg.seed || null;   // 이전 phase에서 이어받는 상태 (하이브리드용)
  function copy2(mtx){ return mtx.map(function(r){ return r.slice(); }); }
  var partner = seed ? copy2(seed.partner) : zeros(n);
  var oppo = seed ? copy2(seed.oppo) : zeros(n);
  var prevMatch = seed ? copy2(seed.prevMatch) : zeros(n);
  var played = seed ? seed.played.slice() : new Array(n).fill(0);
  var streak = seed ? seed.streak.slice() : new Array(n).fill(0);
  var seats = courts * (single ? 2 : 4);
  var out = [], total = 0;

  function pick(list, k){
    // cap=true: streak 3 이상은 강제 휴식 (하드 제약). 인원 부족이면 soft fallback
    var pool = list, extra = [];
    if (cfg.cap) {
      var mustRest = list.filter(function(i){ return streak[i] >= 3; });
      var canPlay  = list.filter(function(i){ return streak[i] < 3;  });
      if (canPlay.length >= k) { pool = canPlay; extra = mustRest; }
    }
    // 출전 횟수 적은 사람 우선, 동수면 무작위 — 300회 시도마다 다른 그룹을 탐색해 W_GROUP이 작동한다
    var o = shuffle(pool);
    o.sort(function(a,b){ return played[a] - played[b]; });
    return { act: shuffle(o.slice(0,k)), bye: o.slice(k).concat(extra) };
  }

  // eligiblePool: 특정 인덱스만 이번 phase에서 뛰게 함 (하이브리드 phase 2에서 다수 성별만)
  var allIdx = cfg.eligiblePool ? cfg.eligiblePool.slice()
             : Array.from({length:n},function(_,i){return i;});
  var males   = mixed ? allIdx.filter(function(i){ return cfg.genders[i] !== "F"; }) : null;
  var females = mixed ? allIdx.filter(function(i){ return cfg.genders[i] === "F"; }) : null;

  var fixedN = single ? 2 : 4;
  var pinOK = cfg.anchor && n >= fixedN &&
    (!mixed || (cfg.genders[0] !== cfg.genders[1] && cfg.genders[2] !== cfg.genders[3]));

  for (var r=0;r<rounds;r++){
    var pin = pinOK && r === 0;
    var best=null, bestCost=Infinity;

    // 완전탐색: 인원 적음 + 단코트 + 동성복식/단식 + pin 없음 → 결정론적 최적해
    var canExhaust = !pin && !mixed && courts === 1 && n <= EXHAUST_MAX_N;
    if (canExhaust){
      var pool0 = allIdx.slice();
      if (cfg.cap){
        var canPlay0 = pool0.filter(function(i){ return streak[i] < 3; });
        if (canPlay0.length >= seats) pool0 = canPlay0;
      }
      var minPl = Math.min.apply(null, pool0.map(function(i){ return played[i]; }));
      var mustIn = pool0.filter(function(i){ return played[i] === minPl; });
      var optIn  = pool0.filter(function(i){ return played[i] >  minPl; });
      var groups = (mustIn.length >= seats)
        ? combos(mustIn, seats)
        : combos(optIn, seats - mustIn.length).map(function(rc){ return mustIn.concat(rc); });

      groups.forEach(function(g){
        var byes = allIdx.filter(function(i){ return g.indexOf(i) < 0; });
        // 그룹 다양성 비용 + 직전 라운드 재대면 비용 (모든 6쌍)
        var gc = 0;
        for (var gi=0; gi<g.length-1; gi++){
          for (var gj=gi+1; gj<g.length; gj++){
            gc += (partner[g[gi]][g[gj]] + oppo[g[gi]][g[gj]]) * W_GROUP;
            gc += prevMatch[g[gi]][g[gj]] * W_ADJACENT;
          }
        }
        if (single){
          var pc = oppo[g[0]][g[1]] * W_OPPO + balCost(lv, [g[0]], [g[1]]) + gc;
          if (pc < bestCost){ bestCost = pc; best = { matches:[{a:[g[0]], b:[g[1]]}], byes: byes }; }
        } else {
          for (var kk=0; kk<3; kk++){
            var A = [g[PAIRINGS[kk][0][0]], g[PAIRINGS[kk][0][1]]];
            var B = [g[PAIRINGS[kk][1][0]], g[PAIRINGS[kk][1][1]]];
            var pc2 = partner[A[0]][A[1]]*W_PAIR + partner[B[0]][B[1]]*W_PAIR + balCost(lv, A, B);
            for (var xx=0; xx<2; xx++) for (var yy=0; yy<2; yy++) pc2 += oppo[A[xx]][B[yy]]*W_OPPO;
            pc2 += gc;
            if (pc2 < bestCost){ bestCost = pc2; best = { matches:[{a:A, b:B}], byes: byes }; }
          }
        }
      });
    }

    if (!best) for (var t=0;t<300;t++){
      var ms=[], cost=0, first=0, byes=[], act=[], actM=[], actF=[];

      if (mixed){
        var mp = pin ? males.filter(function(x){ return x > 3; }) : males;
        var fp = pin ? females.filter(function(x){ return x > 3; }) : females;
        var need = courts*2 - (pin ? 2 : 0);
        var rm = pick(mp, need), rf = pick(fp, need);
        actM = rm.act; actF = rf.act; byes = rm.bye.concat(rf.bye);
      } else {
        var pool = pin ? allIdx.filter(function(x){ return x >= fixedN; }) : allIdx;
        var rr = pick(pool, seats - (pin ? fixedN : 0));
        act = rr.act; byes = rr.bye;
      }
      if (pin){
        ms.push(single ? { a:[0], b:[1] } : { a:[0,1], b:[2,3] });
        first = 1;
      }

      for (var c=first;c<courts;c++){
        var idx = c - first, bp=null, bc=Infinity, k, A, B, cc, x, y;
        if (single){
          var g2 = act.slice(idx*2, idx*2+2);
          bp = { a:[g2[0]], b:[g2[1]] };
          bc = oppo[g2[0]][g2[1]] * W_OPPO + balCost(lv, bp.a, bp.b)
             + prevMatch[g2[0]][g2[1]] * W_ADJACENT;
        } else if (mixed){
          // 팀은 반드시 남1·여1 → 짝짓는 방법은 2가지
          var m1=actM[idx*2], m2=actM[idx*2+1], f1=actF[idx*2], f2=actF[idx*2+1];
          var opts = [[[m1,f1],[m2,f2]], [[m1,f2],[m2,f1]]];
          for (k=0;k<2;k++){
            A = opts[k][0]; B = opts[k][1];
            cc = partner[A[0]][A[1]]*W_PAIR + partner[B[0]][B[1]]*W_PAIR + balCost(lv, A, B);
            for (x=0;x<2;x++) for (y=0;y<2;y++) cc += oppo[A[x]][B[y]]*W_OPPO;
            // W_ADJACENT: 직전 라운드 같은 매치였던 6쌍
            cc += (prevMatch[A[0]][A[1]] + prevMatch[B[0]][B[1]]) * W_ADJACENT;
            for (x=0;x<2;x++) for (y=0;y<2;y++) cc += prevMatch[A[x]][B[y]] * W_ADJACENT;
            if (cc<bc){ bc=cc; bp={a:A,b:B}; }
          }
        } else {
          var g4 = act.slice(idx*4, idx*4+4);
          for (k=0;k<3;k++){
            A=[g4[PAIRINGS[k][0][0]],g4[PAIRINGS[k][0][1]]];
            B=[g4[PAIRINGS[k][1][0]],g4[PAIRINGS[k][1][1]]];
            // partner repeats hurt much more than opponent repeats
            cc = partner[A[0]][A[1]]*W_PAIR + partner[B[0]][B[1]]*W_PAIR + balCost(lv, A, B);
            for (x=0;x<2;x++) for (y=0;y<2;y++) cc += oppo[A[x]][B[y]]*W_OPPO;
            cc += (prevMatch[A[0]][A[1]] + prevMatch[B[0]][B[1]]) * W_ADJACENT;
            for (x=0;x<2;x++) for (y=0;y<2;y++) cc += prevMatch[A[x]][B[y]] * W_ADJACENT;
            if (cc<bc){ bc=cc; bp={a:A,b:B}; }
          }
        }
        ms.push(bp); cost += bc;
      }
      // 그룹 다양성 패널티: 4인 그룹 내 이미 같은 게임을 한 쌍이 많을수록 비용 증가
      var grpAct = mixed ? actM.concat(actF) : act;
      for (var gi=0, glen=grpAct.length; gi<glen-1; gi++) {
        for (var gj=gi+1; gj<glen; gj++) {
          cost += (partner[grpAct[gi]][grpAct[gj]] + oppo[grpAct[gi]][grpAct[gj]]) * W_GROUP;
        }
      }
      if (cost<bestCost){ bestCost=cost; best={matches:ms,byes:byes}; }
      if (cost===0) break;
    }
    // commit the round
    var inPlay = new Array(n).fill(false);
    var newPrev = zeros(n);
    best.matches.forEach(function(m){
      if (m.a.length === 2){
        partner[m.a[0]][m.a[1]]++; partner[m.a[1]][m.a[0]]++;
        partner[m.b[0]][m.b[1]]++; partner[m.b[1]][m.b[0]]++;
      }
      m.a.forEach(function(px){ m.b.forEach(function(py){ oppo[px][py]++; oppo[py][px]++; }); });
      m.a.concat(m.b).forEach(function(p){ played[p]++; inPlay[p]=true; });
      // 이 매치의 모든 쌍을 prevMatch에 기록 (다음 라운드에서 W_ADJACENT 페널티 트리거)
      var allP = m.a.concat(m.b);
      for (var pi=0; pi<allP.length-1; pi++){
        for (var pj=pi+1; pj<allP.length; pj++){
          newPrev[allP[pi]][allP[pj]] = 1; newPrev[allP[pj]][allP[pi]] = 1;
        }
      }
      m.sa = null; m.sb = null;
    });
    prevMatch = newPrev;
    for (var q=0;q<n;q++) streak[q] = inPlay[q] ? streak[q]+1 : 0;
    out.push(best); total += bestCost;
  }
  return { rounds: out, cost: total,
           state: { partner: partner, oppo: oppo, prevMatch: prevMatch,
                    played: played, streak: streak } };
}

/* ---- 파트너 고정(고정 조) 대진 ----
   이름 순서대로 (1·2), (3·4), … 를 한 조로 묶고, 조 단위로 대진을 짠다.
   페어는 처음부터 고정이므로 비용은 '같은 조와 다시 붙는 것'과 전력 편차만 본다. */
function attemptFixed(cfg){
  var pairs = cfg.pairs, T = pairs.length, courts = cfg.courts, rounds = cfg.rounds;
  var lv = cfg.lv || null;
  var met = zeros(T);
  var played = new Array(T).fill(0), streak = new Array(T).fill(0);
  var out = [], total = 0;
  var teamIdx = Array.from({length:T},function(_,i){return i;});
  var teamLv = pairs.map(function(p){ return lv ? lv[p[0]] + lv[p[1]] : 0; });

  var pinOK = cfg.anchor && T >= 2;

  for (var r=0;r<rounds;r++){
    var pin = pinOK && r === 0;
    var best=null, bestCost=Infinity;
    for (var t=0;t<300;t++){
      var pool = pin ? teamIdx.filter(function(x){ return x >= 2; }) : teamIdx;
      var need = courts*2 - (pin ? 2 : 0);
      // cap=true: streak 3 이상 팀은 강제 휴식 (하드 제약). 인원 부족이면 soft fallback
      var extraT = [];
      if (cfg.cap) {
        var mustRestT = pool.filter(function(x){ return streak[x] >= 3; });
        var eligT     = pool.filter(function(x){ return streak[x] < 3;  });
        if (eligT.length >= need) { pool = eligT; extraT = mustRestT; }
      }
      // 출전 횟수 적은 팀 우선, 동수면 무작위
      var o = shuffle(pool);
      o.sort(function(a,b){ return played[a] - played[b]; });
      var act = shuffle(o.slice(0,need)), restT = o.slice(need).concat(extraT);
      var ms = [], cost = 0, used = [];
      if (pin){ ms.push({ a:pairs[0].slice(), b:pairs[1].slice(), t:[0,1] }); used.push(0,1); }
      for (var c=0;c<need/2;c++){
        var t1 = act[c*2], t2 = act[c*2+1];
        ms.push({ a:pairs[t1].slice(), b:pairs[t2].slice(), t:[t1,t2] });
        cost += met[t1][t2]*W_OPPO*2;
        if (lv) cost += Math.abs(teamLv[t1]-teamLv[t2])*W_BAL;
        used.push(t1,t2);
      }
      if (cost<bestCost){
        bestCost = cost;
        var byes = [];
        teamIdx.forEach(function(x){ if (used.indexOf(x) < 0) byes = byes.concat(pairs[x]); });
        best = { matches:ms, byes:byes };
      }
      if (cost===0) break;
      // 전 조가 매 라운드 출전해도 '어느 조끼리 붙일지'는 경우가 많아 계속 재시도한다
    }
    var inPlay = new Array(T).fill(false);
    best.matches.forEach(function(m){
      met[m.t[0]][m.t[1]]++; met[m.t[1]][m.t[0]]++;
      inPlay[m.t[0]] = inPlay[m.t[1]] = true;
      played[m.t[0]]++; played[m.t[1]]++;
      m.sa = null; m.sb = null;
      delete m.t;
    });
    for (var q=0;q<T;q++) streak[q] = inPlay[q] ? streak[q]+1 : 0;
    out.push(best); total += bestCost;
  }
  return { rounds: out, cost: total };
}

// 각 참가자의 최장 연속 출전 라운드 수
function streaksOf(sched, n){
  var cur = new Array(n).fill(0), mx = new Array(n).fill(0);
  sched.forEach(function(rd){
    var inP = new Array(n).fill(false);
    rd.matches.forEach(function(m){ m.a.concat(m.b).forEach(function(p){ inP[p]=true; }); });
    for (var i=0;i<n;i++){
      if (inP[i]){ cur[i]++; if (cur[i]>mx[i]) mx[i]=cur[i]; } else cur[i]=0;
    }
  });
  return mx;
}

// 4연속 출전이 물리적으로 가능한 조건인지 (라운드당 휴식 × 4 ≥ 대상 인원)
function streakFeasible(cfg){
  if (cfg.fixed){
    var T = Math.floor(cfg.n/2);
    return 4*(T - cfg.courts*2) >= T;
  }
  if (cfg.type === "mixed"){
    var g = genderSplit(cfg);
    return 4*(g.M - cfg.courts*2) >= g.M && 4*(g.F - cfg.courts*2) >= g.F;
  }
  var pc = cfg.type === "single" ? 2 : 4;
  return 4 * (cfg.n - cfg.courts*pc) >= cfg.n;
}

function buildSchedule(cfg){
  var cap = (cfg.n >= 6 && cfg.games >= 4);   // 6명 이상 · 1인당 4경기 이상일 때만 적용
  // 혼복 하이브리드: 성별 불균형 시 혼복 + 다수 성별 동복 조합
  var hp = hybridPlan(cfg);
  if (hp && !cfg.fixed){
    return buildHybridSchedule(cfg, hp, cap);
  }
  var rr = cfg.rounds || roundsFor(cfg);
  var best = null, bestScore = Infinity;
  for (var i=0;i<10;i++){
    var a = cfg.fixed
      ? attemptFixed({ pairs:cfg.pairs, rounds:rr, courts:cfg.courts,
                       lv:cfg.lv, anchor:true, cap:cap })
      : attempt({ n:cfg.n, rounds:rr, courts:cfg.courts, lv:cfg.lv,
                      type:cfg.type, genders:cfg.genders, anchor:true, cap:cap });
    var vio = 0;
    if (cap) streaksOf(a.rounds, cfg.n).forEach(function(m){ if (m >= 4) vio++; });
    var score = a.cost + vio * 60;
    if (score < bestScore){ bestScore = score; best = a; }
    if (score === 0) break;
  }
  return best.rounds;
}

// 하이브리드 스케줄: 혼복 phase → 다수 성별 동복 phase
function buildHybridSchedule(cfg, hp, cap){
  // Phase 1: 혼복 라운드
  var phase1 = attempt({
    n: cfg.n, rounds: hp.mixedRounds, courts: cfg.courts, lv: cfg.lv,
    type: "mixed", genders: cfg.genders, anchor: true, cap: cap
  });
  if (hp.sameRounds === 0) return phase1.rounds;
  // Phase 2: 다수 성별만 뛰는 동복 라운드
  var majorityIdx = [];
  for (var i=0; i<cfg.n; i++){
    var gi = cfg.genders[i];
    if (hp.majorityGender === "M" && gi !== "F") majorityIdx.push(i);
    if (hp.majorityGender === "F" && gi === "F") majorityIdx.push(i);
  }
  var phase2 = attempt({
    n: cfg.n, rounds: hp.sameRounds, courts: cfg.courts, lv: cfg.lv,
    type: "same", genders: cfg.genders, anchor: false, cap: cap,
    seed: phase1.state, eligiblePool: majorityIdx
  });
  return phase1.rounds.concat(phase2.rounds);
}

// 복식이면 중복 페어 수, 단식이면 중복 대진 수
function dupPairs(sched){
  var seen = {}, dup = 0;
  function mark(a,b){
    var k = Math.min(a,b)+"-"+Math.max(a,b);
    if (seen[k]) dup++; else seen[k]=1;
  }
  sched.forEach(function(r){
    r.matches.forEach(function(m){
      if (m.a.length === 2){ mark(m.a[0],m.a[1]); mark(m.b[0],m.b[1]); }
      else mark(m.a[0], m.b[0]);
    });
  });
  return dup;
}

/* ---------------- helpers ---------------- */
function nameIn(sess, i){
  var v = ((sess.names || [])[i] || "").trim();
  return v || ("참가자 " + (i+1));
}
function nameOf(i){ return nameIn(S, i); }
// 커스텀 이름이 있으면 그걸, 아니면 기본 "코트 N"
function courtLabel(idx){
  var custom = (S.courtNames || [])[idx];
  return (custom && custom.trim()) ? custom.trim() : "코트 " + (idx + 1);
}
// 종목별 코트 1면 정원 (단식 2명 / 복식 4명)
function perCourt(mode){ return mode === "single" ? 2 : 4; }
function typeOf(sess){
  return sess.mode === "single" ? "single" : (sess.pair === "mixed" ? "mixed" : "same");
}
function minPlayers(mode){ return perCourt(mode); }

// 인원별 선택 가능한 최대 코트 수
// 복식 8명↑ 2코트, 12명↑ 3코트, 16명↑ 4코트 / 단식 4명↑ 2코트, 6명↑ 3코트, 8명↑ 4코트
function maxCourts(n, mode, genders, fixed){
  var byCount = Math.floor(n / perCourt(mode));
  if (genders){   // 혼복은 남녀 각각 코트당 2명씩 필요
    var g = genderSplit({ n:n, genders:genders });
    byCount = Math.min(byCount, Math.floor(g.M/2), Math.floor(g.F/2));
  }
  if (fixed) byCount = Math.min(byCount, Math.floor(Math.floor(n/2)/2));   // 조 2개 = 코트 1면
  return Math.max(1, Math.min(4, byCount));
}
function courtsOf(sess){ return sess.courts || maxCourts(sess.count, sess.mode); }

/* ---- 고정 조(파트너 고정) ---- */
// 이름 순서대로 2명씩 묶는다. 홀수면 마지막 1명은 빠진다
function pairsOf(sess){
  var ps = [];
  for (var i=0;i+1<sess.count;i+=2) ps.push([i,i+1]);
  return ps;
}
// 6인 동성복식에서 2인 고정페어를 쓸 수 있는지
function sameFixedEligible(sess){
  return sess.mode === "double" && sess.pair === "same" && sess.count === 6;
}
// 파트너 고정을 쓸 수 있는 상태인가
// - 혼복: 짝수 인원 · 각 조가 남1·여1
// - 동성복식: 6인 한정 · samePartner="fixed"
function fixedMode(sess){
  if (sess.mode !== "double") return false;
  if (sess.pair === "mixed" && sess.mixPartner === "fixed") return true;
  if (sameFixedEligible(sess) && sess.samePartner === "fixed") return true;
  return false;
}
function fixedProblem(sess){
  if (sess.count % 2 !== 0) return "파트너 고정은 인원이 짝수여야 합니다. (현재 " + sess.count + "명)";
  // 동성복식 고정페어는 성별 체크 불필요 (6인 한정만 확인)
  if (sess.pair === "same"){
    if (sess.count !== 6) return "2인 고정페어는 6인 동성복식에서만 지원합니다.";
    return "";
  }
  var ps = pairsOf(sess), gs = sess.genders || [];
  var badAt = -1;
  for (var i=0;i<ps.length;i++){
    if (gs[ps[i][0]] === gs[ps[i][1]]){ badAt = i; break; }
  }
  if (badAt >= 0)
    return (ps[badAt][0]+1) + "·" + (ps[badAt][1]+1) + "번 조가 같은 성별입니다. 각 조는 남 1명 · 여 1명이어야 합니다.";
  if (ps.length < 2) return "파트너 고정은 조가 2개 이상(4명 이상) 필요합니다.";
  return null;
}

function genderSplit(cfg){
  var M=0, F=0, gs = cfg.genders || [];
  for (var i=0;i<cfg.n;i++){ if (gs[i] === "F") F++; else M++; }
  return { M:M, F:F };
}

// 전원이 최소 g경기를 뛰려면 몇 라운드가 필요한지
// 혼복 하이브리드 계산: 성별 불균형으로 소수 성별이 games+1을 초과하는 경우
// → 혼복 라운드 + 다수 성별 동복 라운드로 분할
// 반환: null (하이브리드 불필요) 또는 { mixedRounds, sameRounds, majorityGender: "M"|"F" }
function hybridPlan(cfg){
  if (cfg.type !== "mixed" || cfg.fixed) return null;
  var g = genderSplit(cfg);
  var M = g.M, F = g.F, C = cfg.courts, G = cfg.games;
  if (M < 2 || F < 2) return null;   // 혼복 자체가 불가 (다른 곳에서 걸림)
  var minority = Math.min(M, F);
  var majority = Math.max(M, F);
  var majorityGender = (M > F) ? "M" : "F";
  // 다수가 same-sex 라운드 seats(=4C)를 채울 수 있어야 하이브리드 가능
  if (majority < 4 * C) return null;
  // 순수 혼복 라운드 수 (기존 공식)
  var pureRounds = Math.ceil(G * majority / (C * 2));
  // 소수 성별이 매 라운드 참여할 때 게임 수
  var minorityGamesInPure = 2 * C * pureRounds / minority;
  // games+1 이하면 하이브리드 불필요
  if (minorityGamesInPure <= G + 1) return null;
  // 소수가 딱 G 게임이 되도록 혼복 라운드 수 결정 (편차 최소화)
  var idealMixed = Math.round(G * minority / (2 * C));
  var maxMixed   = Math.floor((G + 1) * minority / (2 * C));
  var mixedRounds = Math.max(0, Math.min(idealMixed, maxMixed));
  // 다수의 남은 슬롯 = M×G - 혼복에서 얻은 슬롯
  var majoritySlotsFromMixed = 2 * C * mixedRounds;
  var majorityRemaining = majority * G - majoritySlotsFromMixed;
  var sameRounds = Math.max(0, Math.ceil(majorityRemaining / (4 * C)));
  // 안전 하한: 혼복 최소 1라운드 이상 (그래야 혼복 취지 유지)
  if (mixedRounds < 1 && sameRounds > 0) return null;
  return { mixedRounds: mixedRounds, sameRounds: sameRounds, majorityGender: majorityGender };
}

function roundsFor(cfg){
  if (cfg.fixed){   // 조 단위 — 한 라운드에 코트수×2 조가 뛴다
    var T = Math.floor(cfg.n/2);
    return Math.ceil(T * cfg.games / (cfg.courts * 2));
  }
  if (cfg.type === "mixed"){
    var hp = hybridPlan(cfg);
    if (hp) return hp.mixedRounds + hp.sameRounds;
    var g = genderSplit(cfg);
    return Math.ceil(cfg.games * Math.max(g.M, g.F) / (cfg.courts * 2));
  }
  return Math.ceil(cfg.n * cfg.games / (cfg.courts * perCourt(cfg.type === "single" ? "single" : "double")));
}

// 그 라운드 수에서 실제로 배분되는 1인당 경기 수 { rounds, min, max, extra }
function loadFor(cfg){
  var R = roundsFor(cfg);
  if (cfg.fixed){
    var T = Math.floor(cfg.n/2), ts = R * cfg.courts * 2;
    var mnT = Math.floor(ts/T);
    return { rounds:R, min:mnT, max: ts % T ? mnT+1 : mnT, extra: (ts % T) * 2 };
  }
  if (cfg.type === "mixed"){
    var g = genderSplit(cfg), slots = R * cfg.courts * 2;
    var mn = Math.floor(slots/g.M), em = slots % g.M;
    var fn = Math.floor(slots/g.F), ef = slots % g.F;
    return { rounds:R, min:Math.min(mn,fn),
             max:Math.max(em?mn+1:mn, ef?fn+1:fn), extra:em+ef };
  }
  var pc = perCourt(cfg.type === "single" ? "single" : "double");
  var sl = R * cfg.courts * pc, min = Math.floor(sl / cfg.n);
  return { rounds:R, min:min, max: sl % cfg.n ? min+1 : min, extra: sl % cfg.n };
}

// 현재 설정으로 만든 계산용 cfg
function cfgNow(){
  var fx = fixedMode(S) && !fixedProblem(S);
  return { n:S.count, courts:S.courts, games:S.games, type:typeOf(S), genders:S.genders,
           lv: S.useLevel ? lvArr(S) : null,
           fixed: fx, pairs: fx ? pairsOf(S) : null };
}
// 대진 생성용 cfg (라운드 수까지 계산)
function genCfg(){
  var c = cfgNow(); c.rounds = roundsFor(c); return c;
}
// 실제로 생성된 대진의 팀 전력 편차 평균 (등급 사용 시 표시용)
function balOf(sess){
  var lv = lvArr(sess), tot = 0, cnt = 0;
  (sess.schedule || []).forEach(function(r){
    r.matches.forEach(function(m){
      var s = 0, i;
      for (i=0;i<m.a.length;i++) s += lv[m.a[i]];
      for (i=0;i<m.b.length;i++) s -= lv[m.b[i]];
      tot += Math.abs(s); cnt++;
    });
  });
  return cnt ? tot/cnt : 0;
}
function filled(m){ return m.sa !== null && m.sa !== "" && m.sb !== null && m.sb !== ""; }

function stats(sess){
  sess = sess || S;
  var n = sess.count, rows = [];
  for (var i=0;i<n;i++) rows.push({i:i,g:0,w:0,d:0,l:0,f:0,a:0});
  if (sess.schedule) sess.schedule.forEach(function(r){
    r.matches.forEach(function(m){
      if (!filled(m)) return;
      var sa = +m.sa, sb = +m.sb;
      m.a.forEach(function(p){ var x=rows[p]; x.g++; x.f+=sa; x.a+=sb; if(sa>sb)x.w++; else if(sa<sb)x.l++; else x.d++; });
      m.b.forEach(function(p){ var x=rows[p]; x.g++; x.f+=sb; x.a+=sa; if(sb>sa)x.w++; else if(sb<sa)x.l++; else x.d++; });
    });
  });
  var mode = sess.sort || "diff";
  rows.forEach(function(x){ x.dif = x.f - x.a; });
  rows.sort(function(a,b){
    if (mode === "win") return b.w-a.w || b.dif-a.dif || b.f-a.f || a.i-b.i;
    return b.dif-a.dif || b.w-a.w || b.f-a.f || a.i-b.i;
  });
  var rank=0, prev=null;
  rows.forEach(function(x,idx){
    var key = mode==="win" ? x.w+"/"+x.dif+"/"+x.f : x.dif+"/"+x.w+"/"+x.f;
    if (key !== prev){ rank = idx+1; prev = key; }
    x.rank = rank;
  });
  return rows;
}

function progressOf(sess){
  var done=0, all=0;
  (sess.schedule || []).forEach(function(r){ r.matches.forEach(function(m){ all++; if (filled(m)) done++; }); });
  return { done:done, all:all };
}

/* ---------------- 공유 링크 (서버 없이 URL 해시로 결과 전달) ----------------
   #v1=<base64url> 안에 날짜·설정·대진·점수를 담는다. 휴식자는 복원 시 다시 계산한다. */
function b64enc(str){
  var bin;
  try {
    var by = new TextEncoder().encode(str), i;
    bin = ""; for (i=0;i<by.length;i++) bin += String.fromCharCode(by[i]);
  } catch(e){ bin = unescape(encodeURIComponent(str)); }
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64dec(s){
  var bin = atob(String(s).replace(/-/g,"+").replace(/_/g,"/"));
  try {
    var by = new Uint8Array(bin.length), i;
    for (i=0;i<bin.length;i++) by[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(by);
  } catch(e){ return decodeURIComponent(escape(bin)); }
}

function encodeShare(sess){
  var head = [
    sess.date, sess.mode, sess.pair, sess.count, sess.courts, sess.games, sess.sort || "diff",
    sess.useLevel ? 1 : 0, sess.mixPartner === "fixed" ? "f" : "r",
    (sess.genders || []).slice(0, sess.count).map(function(g){ return g === "F" ? "F" : "M"; }).join(""),
    (sess.levels  || []).slice(0, sess.count).map(function(v){ return (v===1||v===3) ? v : 2; }).join(""),
    sess.samePartner === "fixed" ? "f" : "r"     // h[11]: 동성복식 6인 2인 고정페어
  ].join("~");
  var body = (sess.schedule || []).map(function(r){
    return r.matches.map(function(m){
      return m.a.join(".") + "-" + m.b.join(".") + "="
           + (filled(m) ? m.sa + ":" + m.sb : "");
    }).join(",");
  }).join(";");
  var names = (sess.names || []).slice(0, sess.count).map(function(v){
    return String(v || "").replace(/[|~;\n]/g, " ");
  }).join("|");
  return b64enc([head, names, body].join("\n"));   // 구획은 개행 — 데이터에 들어갈 수 없다
}

function decodeShare(code){
  var raw = b64dec(code), parts = raw.split("\n");
  if (parts.length < 3) throw new Error("형식 오류");
  var h = parts[0].split("~");
  var count = +h[3];
  if (!(count >= 2 && count <= 24)) throw new Error("인원 오류");
  var sess = {
    date: h[0], mode: h[1] === "single" ? "single" : "double",
    pair: h[2] === "mixed" ? "mixed" : "same",
    count: count, courts: +h[4] || 1, games: +h[5] || 4,
    sort: h[6] === "win" ? "win" : "diff",
    useLevel: h[7] === "1", mixPartner: h[8] === "f" ? "fixed" : "random",
    genders: String(h[9] || "").split("").map(function(c){ return c === "F" ? "F" : "M"; }),
    levels: String(h[10] || "").split("").map(function(c){ var v = +c; return (v===1||v===3) ? v : 2; }),
    samePartner: h[11] === "f" ? "fixed" : "random",
    names: parts[1] === "" ? [] : parts[1].split("|"),
    savedAt: null
  };
  sess.schedule = (parts[2] === "" ? [] : parts[2].split(";")).map(function(rs){
    var inPlay = {};
    var matches = rs.split(",").map(function(ms){
      var mm = ms.split("=");
      var sides = mm[0].split("-");
      var team = function(t){
        return t.split(".").map(function(x){
          var i = +x;
          if (!(i >= 0 && i < count)) throw new Error("번호 오류");
          inPlay[i] = 1; return i;
        });
      };
      var sc = (mm[1] || "").split(":");
      return { a:team(sides[0]), b:team(sides[1]),
               sa: sc[0] === "" || sc[0] === undefined ? null : +sc[0],
               sb: sc[1] === "" || sc[1] === undefined ? null : +sc[1] };
    });
    var byes = [];
    for (var i=0;i<count;i++) if (!inPlay[i]) byes.push(i);
    return { matches:matches, byes:byes };
  });
  return sess;
}

function shareUrl(){
  var base = location.origin + location.pathname + location.search;
  return base + "#v1=" + encodeShare(snapshot());
}

function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 1800);
}

/* ---------------- intro (종목 선택) ---------------- */
var introStep = 0;   // 0: 코트 목록(랜딩), 1: 단식/복식, 2: 동성/혼성

function modeLabel(sess){
  if (sess.mode === "single") return "단식";
  return sess.pair === "mixed" ? "복식 · 혼성" : "복식 · 동성";
}

function dots(kind){
  // 코트 아이콘 안의 공 배치
  var pos = kind === "single"
    ? [[26,26],[26,66]]
    : [[16,26],[36,26],[16,66],[36,66]];
  return pos.map(function(q){
    return '<i style="left:' + q[0] + '%;top:' + q[1] + '%"></i>';
  }).join("");
}

function renderIntro(){

    host.innerHTML = errBox +

      '<p class="eyebrow" style="margin:20px 0 8px">진행중인 코트</p>' +
      '<div id="intro-courts"><div class="card"><p class="empty">불러오는 중…</p></div></div>' +
      '<div style="margin-top:20px"><button class="btn primary" id="intro-new" style="width:100%;padding:16px;font-size:15px">＋ 새 코트 만들기</button></div>';
    $("#intro-new").addEventListener("click", function(){ introStep = 1; renderIntro(); });
    loadIntroCourts();
    return;
  }

  var opts = introStep === 1
    ? [{ k:"single", t:"단식", d:"1 대 1 · 코트당 2명" },

    : [{ k:"same",  t:"동성 복식", d:"성별 구분 없이 팀 구성" },
       { k:"mixed", t:"혼성 복식", d:"모든 팀을 남 1명 · 여 1명으로" }];

  host.innerHTML =
    '<h2>' + (introStep === 1 ? "어떤 경기를 하시나요?" : "복식 방식을 골라주세요") + '</h2>' +
    '<p class="lead">' + (introStep === 1
      ? "종목에 따라 코트 정원과 대진 방식이 달라집니다."
      : "혼성을 고르면 참가자별 성별을 입력하게 됩니다.") + '</p>' +
    '<div class="pickers">' + opts.map(function(o){
      return '<button class="pick" data-k="' + o.k + '">' +
        '<span class="pick-ico">' + dots(o.k === "single" ? "single" : "double") + '</span>' +

        '<span class="pick-d">' + o.d + '</span></span>' +
      '</button>';
    }).join("") + '</div>' +
    '<div class="intro-back" style="margin-top:12px"><button class="btn ghost" id="intro-back" style="width:100%">' +
      (introStep === 2 ? "← 단식·복식 다시 고르기" : "← 코트 목록으로") + '</button></div>';

  Array.prototype.forEach.call(host.querySelectorAll(".pick"), function(b){

// 랜딩 페이지의 진행중 코트 목록 로드
